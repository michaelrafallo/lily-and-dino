let hunting = null;
function huntVoices(){
  if (!hasTTS || recast() || hunting) return;
  let tries = 0;
  hunting = setInterval(() => {
    if (recast() || ++tries > 40){ clearInterval(hunting); hunting = null; }   // ~10s
  }, 250);
}
if (hasTTS){
  try {
    speechSynthesis.addEventListener('voiceschanged', recast);
    huntVoices();
  } catch(e){}   // a broken engine loses its voice, never the book
}

/* iOS refuses to speak unless the very first utterance is handed over from
   inside a real touch handler; one arriving even a tick later is silently
   dropped, which is why read-aloud did nothing at all on an iPhone. A single
   silent word on first touch opens the engine for the rest of the visit. */
let ttsPrimed = false;
function primeTTS(){
  if (ttsPrimed || !hasTTS) return;
  ttsPrimed = true;
  try {
    speechSynthesis.cancel();          // clear anything wedged from a previous visit
    /* A real word, not a blank: some engines ignore an utterance with nothing
       in it and stay locked. Said at no volume and at full tilt, so it is over
       before it is heard. */
    const u = new SpeechSynthesisUtterance('a');
    u.volume = 0; u.rate = 10;
    speechSynthesis.speak(u);
  } catch(e){}
  recast();
}

/* Chrome - desktop and Android alike - stops speaking after about fifteen
   seconds unless it is nudged, which cut long pages off mid-sentence. The
   nudge is inaudible. iOS needs no nudging and dislikes being paused. */
let sayRun = 0, beat = null, sayStart = 0;
function heartbeat(on){
  if (!on || IOS || !hasTTS){ clearInterval(beat); beat = null; return; }
  if (beat) return;         // already ticking: it must run across lines, not restart on each
  beat = setInterval(() => {
    if (!speechSynthesis.speaking){ clearInterval(beat); beat = null; return; }
    /* Only a line that has been going a long time is in danger of the
       cut-off. Nudging a short one buys nothing and makes Google's voices
       stutter, so leave ordinary lines alone. */
    if (Date.now() - sayStart < 11000) return;
    speechSynthesis.pause(); speechSynthesis.resume();
  }, 3000);
}
function shutUp(){
  if (!hasTTS) return;
  sayRun++;                 // whatever was being read is abandoned
  heartbeat(false);
  clearTimeout(sayTimer); clearTimeout(lineGuard); clearTimeout(startGuard);
  clearWords(); markWord(null); hideBubble(true);
  /* resume() after cancel(): a cancel landing between the nudge's pause and
     its resume otherwise leaves Android paused for good, and silent. */
  try { speechSynthesis.cancel(); if (speechSynthesis.paused) speechSynthesis.resume(); } catch(e){}
}
/* How far a voice can be bent before it stops sounding like a person.
   Google's voices are streamed and synthesised on the fly, and they slur
   badly once pitch or speed moves far from the middle - which is what made
   the storyteller on "Google US English" sound messy. Those voices get the
   same colouring, applied about half as hard and never taken below three
   quarter speed. The reading-speed setting is applied afterwards, so Slow
   still means slow. Everything else keeps the full range. */
const fussy = v => !!v && (/google/i.test(v.name || '') || v.localService === false);
const half = x => 1 + (x - 1) * .5;
const sayPitch = (x, v) => fussy(v) ? clamp(1 + (x - 1) * .55, .7, 1.35)
                                    : clamp(x, MOBILE ? .5 : .1, MOBILE ? 1.8 : 2);
const sayRate  = (x, sp, v) => fussy(v) ? clamp(half(x) * (sp || 1), .7, 1.4)
                                        : clamp(x * (sp || 1), MOBILE ? .6 : .1, MOBILE ? 1.6 : 10);

/* How a line should be *said*. Punctuation and a few telling words carry most
   of it; a page written as night-time is sleepy throughout; and a mood written
   into the page itself wins over all of that. The storyteller keeps her
   composure — the big feelings belong to Lily and Dino. */
const MOOD = {
  plain:  { p:1,    r:1,    v:1   },
  warm:   { p:1.03, r:.95,  v:1   },
  bright: { p:1.08, r:1.02, v:1   },
  asking: { p:1.12, r:.97,  v:1   },
  excited:{ p:1.18, r:1.07, v:1   },
  giggly: { p:1.24, r:1.12, v:1   },
  shy:    { p:.93,  r:.86,  v:.68 },
  sleepy: { p:.9,   r:.74,  v:.8  },
  roar:   { p:.5,   r:.75,  v:1   }
};
function moodOf(txt, pg, tag, who){
  let m = tag;
  if (!m){
    if (/ROO+A+R/i.test(txt)) m = 'roar';
    else if (/giggl|laugh|hee hee|ha ha/i.test(txt)) m = 'giggly';
    else if (pg.last || pg.time === 'night') m = 'sleepy';
    else if (/\?/.test(txt)) m = 'asking';
    else if (/!/.test(txt)) m = 'excited';
    else if (/shy|quietly|whisper/i.test(txt)) m = 'shy';
    else m = 'plain';
  }
  if (who === 'narrator'){
    if (m === 'roar' || m === 'excited') m = 'bright';
    else if (m === 'giggly') m = 'warm';
  }
  return m;
}

/* split each line so words inside “quotes” get the character's voice and the
   words around them stay with the storyteller */
function lineParts(pg){
  if (pg.title) return [{who:'narrator',txt:'Lily and Dino’s Magical Tea Party.',mood:'warm'}];
  const out = [];
  pg.lines.forEach((l,line) => {
    const [who, text, tag] = typeof l === 'string' ? ['', l] : l;
    const chunks = text.split(/(“[^”]*”)/g).filter(s => s && s.trim());
    chunks.forEach(c => {
      const quoted = c.charAt(0) === '“';
      const v = quoted ? (who || (/ROO+A+R/i.test(c) ? 'dino' : 'narrator'))
                       : (who && chunks.length === 1 ? who : 'narrator');
      out.push({ who:v, txt:c.replace(/[“”]/g,'').trim(), raw:c.trim(), line, mood:moodOf(c, pg, tag, v) });
    });
  });
  /* pi numbers the chunks across the whole page. The words on screen carry
     the same number, which is how the highlight finds them. */
  return out.filter(p => p.txt).map((p, i) => (p.pi = i, p));
}
/* lines that are a noise rather than words */
/* A sound line is the moment the page has been building to, and it owns the
   whole of that moment - the noise, the shout across the picture and the
   shake - so that everything lands on the word as it lights up. The only
   guard is against the same line double-firing within a heartbeat. */
const SOUNDLINES = [
  { re:/^R+O+A+R+!*$/i, len:() => clipLen('roar'),
    play: () => {
      // behind a tree he is unseen, so the shout goes where the noise came from
      const seen = actors.dino && actors.dino.shown;
      roar(seen ? { gap:350 } : { gap:350, x:780, y:170, big:true });
      return true;
    } },
  { re:/^S+L+U+R+P+!*$/i, len:() => clipLen('slurp'),
    play: () => {
      const rang = sndSlurp(350);
      const m = mouthPos();
      popText(m.x - 40, m.y - 60, 'SLURP!', { size:54, color:'#C9772F', hold:900 });
      return rang;
    } }
];
function soundLine(txt){
  const t = String(txt).replace(/[^A-Za-z!]/g,'');
  for (let i = 0; i < SOUNDLINES.length; i++) if (SOUNDLINES[i].re.test(t)) return SOUNDLINES[i];
  return null;
}
/* What one written word is worth out loud. Quotation marks are not spoken,
   and a picture has no sound at all - a word that comes back empty is left
   out of the voice but keeps its place on the page. */
const sayWord = w => String(w)
  .replace(/[“”„"]/g,'')
  .replace(/ROO+A+R!*/gi,'Roar!')
  .replace(/SLURP!*/gi,'Slurp!')
  .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'')
  .trim();

/* Follow the reading word by word. A good engine reports each word as it
   reaches it; many phone engines never do, so the words are also paced out by
   their length, and that guess is dropped the moment a real report arrives. */
let wordTimers = [], sawBoundary = false, sayTimer = null, lineGuard = null, startGuard = null;
const wordsOf = t => String(t).split(/\s+/).filter(Boolean);
function clearWords(){ wordTimers.forEach(clearTimeout); wordTimers = []; }
function markWord(pi, wi){
  const box = $('#story');
  const want = pi == null ? null : box.querySelector('.w[data-pi="' + pi + '"][data-wi="' + wi + '"]');
  const lit = box.querySelector('.w.saying');
  if (lit === want) return;          // the guess and the engine often mean the same word
  if (lit) lit.classList.remove('saying');
  if (!want) return;
  want.classList.add('saying');
  /* a long page scrolls inside its panel, so keep the word being said in
     sight - there is no point lighting a word nobody can see */
  if (box.scrollHeight > box.clientHeight + 2){
    const w = want.getBoundingClientRect(), b = box.getBoundingClientRect();
    if (w.top < b.top + 4 || w.bottom > b.bottom - 4)
      box.scrollTo({ top: box.scrollTop + (w.top - b.top) - box.clientHeight * .35,
                     behavior: reduce ? 'auto' : 'smooth' });
  }
}
function paceWords(words, rate, pi, toSpan){
  clearWords();
  let t = 0;
  words.forEach((w,k) => {
    const at = toSpan ? toSpan[k] : k;
    wordTimers.push(setTimeout(() => { if (!sawBoundary) markWord(pi, at); }, t));
    t += (w.length * 28 + 70) / (rate || 1);    // fitted to what a real engine reports
  });
}
function markLine(i){
  $('#story').querySelectorAll('p[data-line]').forEach(p => p.classList.toggle('speaking', +p.dataset.line === i));
}
/* the one who is speaking acts it out, so a child who cannot read yet can
   still tell who is talking and how they feel */
/* How each mood looks. A line is not only said in a voice, it is stood in:
   a question tips the head, delight jumps, shyness rocks on the spot, and a
   sleepy line lets the whole body sag. */
const MOVES = {
  lily: { excited:'hop', giggly:'giggle', bright:'sway', warm:'sway',
          asking:'tilt', shy:'giggle', sleepy:'droop' },
  dino: { excited:'hop', giggly:'chuckle', bright:'hop', warm:'tiptoe',
          asking:'tilt', shy:'shy', sleepy:'droop' }
};
function emote(who, mood){
  const a = actors[who];
  if (!a || !a.shown || a.el.classList.contains('sleep')) return;
  if (who === 'dino' && mood === 'roar'){
    a.el.classList.add('roaring');
    setTimeout(() => a.el.classList.remove('roaring'), 900);
    return dinoReact('hop');
  }
  // a blush belongs to the bashful and the fond, whoever is speaking
  if (who === 'lily' && mood === 'giggly') giggle();
  if (mood === 'shy' || mood === 'warm'){
    a.el.classList.add('blush');
    setTimeout(() => a.el.classList.remove('blush'), 1600);
  }
  const move = (MOVES[who] || {})[mood];
  if (move) return (who === 'lily' ? lilyReact : dinoReact)(move);
  nod(who);                       // anything plainly said gets a plain nod
}
function nod(who){
  const a = actors[who];
  if (!a || !a.shown || a.el.classList.contains('sleep')) return;
  const el = who === 'dino' ? a.el.querySelector('.d-head') : a.el.querySelector('.react');
  if (!el) return;
  el.animate(who === 'dino'
    ? [{transform:'rotate(0deg)'},{transform:'rotate(5deg)'},{transform:'rotate(0deg)'}]
    : [{transform:'translateY(0px)'},{transform:'translateY(-9px)'},{transform:'translateY(0px)'}],
    {duration:560,easing:'ease-in-out'});
}
/* ---------- choosing who reads (hold the read-aloud button) ---------- */
const ROLE = { narrator:'Storyteller', lily:'Lily', dino:'Dino' };
const PREVIEW = {
  narrator:'Once upon a time, in a cozy magical forest, there lived a little fairy.',
  lily:'I can be your friend!',
  dino:'I am looking for a friend.'
};
function sample(who){
  if (!hasTTS) return;
  const busy = speechSynthesis.speaking || speechSynthesis.pending;
  shutUp();
  const run = sayRun;
  const play = () => {
    if (run !== sayRun) return;
    const c = CAST[who], u = new SpeechSynthesisUtterance(PREVIEW[who]);
    if (picked[who]) u.voice = picked[who];
    u.pitch = sayPitch(c.pitch, u.voice); u.rate = sayRate(c.rate, 1, u.voice);
    speechSynthesis.speak(u);
  };
  if (busy) setTimeout(play, 120); else play();
}
function buildPicker(){
  let all = [];
  try { all = hasTTS ? speechSynthesis.getVoices() : []; } catch(e){}
  const en = all.filter(v => /^en/i.test(v.lang));
  const list = (en.length ? en : all).slice()
    .sort((a,b) => (isNatural(b) - isNatural(a)) || a.name.localeCompare(b.name));
  const rows = $('#vrows');
  rows.innerHTML = '';
  /* Nothing to choose from is worth a sentence, not three blank menus. */
  if (!list.length){
    const msg = document.createElement('p');
    msg.className = 'vempty';
    msg.textContent = hasTTS
      ? 'No voices have appeared on this device yet \u2014 still looking. If none come, ask a grown-up to switch on the text-to-speech engine in the tablet\u2019s settings, or open the story in Chrome, Safari or Edge.'
      : 'This browser cannot read stories aloud. Open the story in Chrome, Safari or Edge to hear Lily and Dino.';
    rows.appendChild(msg);
    $('#voicenote').textContent = 'The story is still lovely to read aloud yourselves.';
    if (hasTTS){ primeTTS(); huntVoices(); }   // poke the engine and keep hunting
    return;
  }
  Object.keys(ROLE).forEach(who => {
    const row = document.createElement('div'); row.className = 'vrow';
    const lab = document.createElement('label'); lab.className = who; lab.textContent = ROLE[who];
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', ROLE[who] + ' voice');
    list.forEach(v => {
      const o = document.createElement('option');
      o.value = v.voiceURI;
      o.textContent = (isNatural(v) ? '✨ ' : '') + v.name;
      if (picked[who] && picked[who].voiceURI === v.voiceURI) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { S.voices[who] = sel.value; save(); pickVoices(); sample(who); };
    const play = document.createElement('button');
    play.type = 'button'; play.className = 'vplay'; play.textContent = '▶';
    play.setAttribute('aria-label', 'Hear ' + ROLE[who]);
    play.onclick = () => sample(who);
    row.append(lab, sel, play);
    rows.appendChild(row);
  });
  $('#voicenote').textContent = list.some(isNatural)
    ? 'The ✨ voices are the natural-sounding ones. Your choice is kept on this device.'
    : (MOBILE
        ? 'These are the voices this device offers. Installing more in the tablet\u2019s text-to-speech settings \u2014 or opening the story in another browser \u2014 can add nicer ones.'
        : 'This browser only offers the older robotic voices. Opening the story in Microsoft Edge \u2014 or on a phone or tablet \u2014 gives you free natural voices, including a child\u2019s voice for Lily.');
}
function openVoices(){ buildPicker(); $('#voices').classList.add('open'); }
function closeVoices(){ $('#voices').classList.remove('open'); shutUp(); }
$('#vdone').onclick = closeVoices;
$('#voices').addEventListener('click', e => { if (e.target === $('#voices')) closeVoices(); });
addEventListener('keydown', e => { if (e.key === 'Escape'){ closeVoices(); closeMagic(); setDrawer(false); } });
$('#mdone').onclick = closeMagic;
$('#magic').addEventListener('click', e => { if (e.target === $('#magic')) closeMagic(); });

/* the drawer */
$('#drawerTab').onclick = () => { const open = !drawerOpen(); setDrawer(open); if (open){ buzz(6); updateDrawer(); } };
$('#dvoices').onclick = () => { setDrawer(false); openVoices(); };
$('#stage').addEventListener('pointerdown', e => {
  if (drawerOpen() && !e.target.closest('#drawer')) setDrawer(false);
}, true);

function speak(){
  if (!readOn || !hasTTS || freePlay()) return;   // not while the picture is a toy
  const busy = speechSynthesis.speaking || speechSynthesis.pending;
  shutUp();
  const run = sayRun;
  markLine(-1);
  if (!picked.narrator) pickVoices();
  const at = cur, list = lineParts(P[cur]);
  if (!list.length) return;
  // a page with a roar or a slurp in it keeps the party quiet until it lands
  if (list.some(q => soundLine(q.txt))) holdHoliday(40);
  /* One line at a time, each handed over by the one before it. Giving a phone
     the whole page at once is where it drops lines, and where the storyteller
     could come back in Dino's voice: the engine had already swallowed the
     queue before the voice list finished loading. */
  const sayOne = (i, retry) => {
    if (run !== sayRun || at !== cur || !readOn) return;
    clearTimeout(lineGuard); clearTimeout(startGuard);
    if (i >= list.length){
      heartbeat(false); markLine(-1); markWord(null); hideBubble();
      // once the telling of this page is done, the choice comes up
      if (P[cur] && (P[cur].last || P[cur].title)) later(() => { if (!freePlay()) showEnd(true, !!P[cur].title); }, 900);
      return;
    }
    const p = list[i], c = CAST[p.who] || CAST.narrator, m = MOOD[p.mood] || MOOD.plain;
    /* A roar or a slurp is a sound, not a word. Having a voice read the
       letters out on top of the recording was the same noise twice over, so
       the line makes the sound instead and the reading waits for it. If the
       page has just made that sound itself, the line stays quiet rather than
       repeating it. */
    const sl = soundLine(p.txt);
    if (sl){
      markLine(p.line);
      /* The written ROOOAAAR! lights up for exactly as long as the roar is
         heard, so the page and the sound are plainly the same moment. */
      markWord(p.pi, 0);
      /* No speech bubble here: the shout goes right across the picture in
         big letters, and saying it twice over is just clutter. */
      hideBubble();
      if (p.mood === 'roar') emote(p.who, p.mood);
      const rang = sl.play();
      holdHoliday(clamp(sl.len() + .9, 1.2, 4));     // now the party may carry on
      const hold = rang ? clamp(Math.round(sl.len() * 1000) + 320, 700, 2400) : 700;
      clearTimeout(sayTimer);
      sayTimer = setTimeout(() => {
        markWord(null);
        if (run === sayRun && at === cur && readOn) sayOne(i + 1);
      }, hold);
      return;
    }
    /* The voice reads the very words that are on the page, in their order,
       and a map ties each spoken word back to the one printed - so the
       highlight lands on exactly the word being said, even where a word is
       written but not spoken. */
    const shown = String(p.raw || p.txt).split(' ').filter(Boolean);
    const spoken = [], toSpan = [];
    shown.forEach((w, k) => { const sw = sayWord(w); if (sw){ spoken.push(sw); toSpan.push(k); } });
    if (!spoken.length){ sayOne(i + 1); return; }      // nothing here to say aloud
    const span = k => toSpan[clamp(k, 0, toSpan.length - 1)];
    const u = new SpeechSynthesisUtterance(spoken.join(' '));
    if (picked[p.who]) u.voice = picked[p.who];
    u.pitch = sayPitch(c.pitch * m.p, u.voice);
    u.rate  = sayRate(c.rate * m.r, S.speed, u.voice);
    u.volume = m.v;
    let gone = false, begun = false;
    const onward = () => {
      if (gone) return;
      gone = true;
      clearTimeout(lineGuard); clearTimeout(startGuard);
      clearWords(); markWord(null); sayOne(i + 1);
    };
    u.onstart = () => {
      begun = true;
      started = true; sayStart = Date.now(); markLine(p.line); emote(p.who, p.mood);
      if (p.who === 'lily' || p.who === 'dino') showBubble(p.who, p.txt); else hideBubble();
      if (!sawBoundary) paceWords(spoken, u.rate, p.pi, toSpan);
    };
    u.onboundary = ev => {
      if (ev.name && ev.name !== 'word') return;
      if (!sawBoundary){ sawBoundary = true; clearWords(); }   // the engine knows better than the guess
      markWord(p.pi, span(wordsOf(String(u.text).slice(0, ev.charIndex)).length));
    };
    u.onend = onward;
    u.onerror = onward;          // a refused line must never leave the page stuck
    sawBoundary = false;
    speechSynthesis.speak(u);
    heartbeat(true);
    /* Two safety nets, because a tablet's engine cannot always be trusted to
       report back. If the line never starts, ask once more; if it never says
       it has finished, carry on anyway rather than leaving the story stuck on
       one sentence for ever. */
    startGuard = setTimeout(() => {
      if (run !== sayRun || gone || begun || speechSynthesis.speaking) return;
      if (retry) onward(); else sayOne(i, true);
    }, 1500);
    const spell = Math.round(String(u.text).length * 80 / (u.rate || 1)) + 2400;
    lineGuard = setTimeout(() => { if (run === sayRun && !gone) onward(); }, spell);
  };
  // Chrome ignores a line handed over in the same tick as a cancel()
  if (busy) later(() => sayOne(0), 120); else sayOne(0);
}

/* ---------- interaction ---------- */
$('#next').onclick = () => go(cur + 1);
$('#prev').onclick = () => go(cur - 1);
$('#story').addEventListener('click', () => { $('#story').classList.add('done'); if (!P[cur].last) $('#next').classList.add('ready'); });
addEventListener('keydown', e => {
  if ($('#voices').classList.contains('open') || drawerOpen() || magicOpen()) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown'){ go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ go(cur - 1); }
});

/* Taps run on pointer events rather than click: the reaction starts the
   instant a finger lands, a little squash confirms the touch, and sliding
   off cancels it the way a button does. */
const TAP_SLOP = 16, TAP_TIME = 800;
const held = new WeakMap();
function pressOn(g){
  if (!g) return;
  pressOff(g);
  held.set(g, g.animate([{transform:'scale(1)'},{transform:'scale(.94)'}],{duration:110,easing:'ease-out',fill:'forwards'}));
}
function pressOff(g){
  const a = g && held.get(g);
  if (a){ a.cancel(); held.delete(g); }
}
/* While the story is being told the picture is not a toy. Only what the line
   under the words invites will answer: "Tap Lily to make her sparkle" means
   Lily, and nothing else - so a child following along is not pulled away by
   everything else that moves. Playtime opens the whole picture up. */
const freePlay = () => document.documentElement.classList.contains('playtime');
function invited(what){
  if (freePlay()) return true;
  const h = (P[cur] && P[cur].hint) || '', taps = /tap/i.test(h);
  if (what === 'lily')  return taps && /\blily\b/i.test(h);
  if (what === 'dino')  return taps && /\bdino\b/i.test(h);
  if (what === 'drag')  return /drag/i.test(h);
  if (what === 'slurp') return taps && /teacup/i.test(h);
  if (what === 'giant') return taps && /giant cup/i.test(h);
  return false;                    // trees, bushes, sun, moon, wand: playtime only
}
function onTap(el, fn, squash){
  let p = null;
  el.addEventListener('pointerdown', e => {
    if (!e.isPrimary || p) return;
    p = { id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now(), g:squash ? squash(e) : null };
    pressOn(p.g);
  });
  el.addEventListener('pointerup', e => {
    if (!p || e.pointerId !== p.id) return;
    const tap = Math.hypot(e.clientX - p.x, e.clientY - p.y) < TAP_SLOP && performance.now() - p.t < TAP_TIME;
    pressOff(p.g); p = null;
    if (tap) fn(e);
  });
  const drop = e => { if (p && e.pointerId === p.id){ pressOff(p.g); p = null; } };
  el.addEventListener('pointercancel', drop);
  el.addEventListener('pointerleave', drop);
}

onTap($('#lily'), e => {
  const s = actors.lily.st;
  // the wand is hers to wave in playtime, not in the middle of the telling
  if (e.target.closest('.l-wand')){ if (freePlay()) openMagic(); return; }
  if (!invited('lily')) return;
  // a tap on the face while she is holding something: she has a sip or a bite
  if (e.target.closest('.l-head') && tryUse('lily')) return;
  buzz(8);
  if ($('#lily').classList.contains('sleep')){ sparkles(s.x, s.y - 90*s.s, 5); popFloat(s.x, s.y - 150*s.s, 'z', '#E9E2FF', 26); return; }
  lilyReact(Math.random() < .5 ? 'spin' : 'hop'); sparkles(s.x, s.y - 100*s.s, 10); chime();
}, () => $('#lily .react'));

onTap($('#dino'), e => {
  const s = actors.dino.st;
  if (!invited('dino')) return;
  if (e.target.closest('.d-head') && tryUse('dino')) return;
  buzz(8);
  if ($('#dino').classList.contains('sleep')){ popFloat(s.x - 60, s.y - 250*s.s, 'Zzz', '#E9E2FF', 34); return; }
  if (cur === 5 || cur === 6){ dinoReact('hop'); hearts(s.x - 60, s.y - 220*s.s, 4); sndPop(); return; }
  dinoReact('hop'); roar({});
}, () => $('#dino .react'));

onTap(worldSvg, e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (!invited(act)) return;
  buzz(8);
  if (act === 'slurp') slurp();
  else if (act === 'giant'){ t.animate([{transform:'scale(1)'},{transform:'scale(1.08,.92)'},{transform:'scale(1)'}],{duration:350}); sparkles(640,460,8); sndPop(); }
  else if (act === 'tree') treeTap(t);
  else if (act === 'bush') rustle(t, .55);
  else if (act === 'mushroom') pokeMushroom(t);
  else if (act === 'sun') pokeSun(t);
}, e => e.target.closest('[data-act]'));

// the moon lives in the glow layer, above the tint, so it gets its own tap
onTap($('#moon'), () => { if (!freePlay()) return; buzz(8); pokeMoon($('#moon .tap')); }, () => $('#moon .tap'));

// dragging props — one finger per prop, so two hands can rearrange the
// picnic at once, and nothing can be dragged off the visible picture
const drags = new Map();
const svgPt = e => { const p = worldSvg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(worldSvg.getScreenCTM().inverse()); };
worldSvg.addEventListener('pointerdown', e => {
  const d = e.target.closest('.drag'); if (!d || d.dataset.held) return;
  if (!invited('drag')) return;
  e.stopPropagation();
  if (d.dataset.hand) unhand(d);          // taken back out of a hand
  d.parentNode.appendChild(d);
  const p = svgPt(e);
  d.dataset.held = '1';
  drags.set(e.pointerId, { el:d, sx:p.x, sy:p.y, ox:+d.dataset.dx, oy:+d.dataset.dy, box:d.getBBox(), t0:Date.now() });
  try { d.setPointerCapture(e.pointerId); } catch(err){}
  d.classList.add('dragging');
  // held things are drawn half again as big, so a small finger can steer them
  d.querySelector('.pop').animate([{transform:'scale(1)'},{transform:'scale(1.5)'}],{duration:160,easing:'ease-out',fill:'forwards'});
  sndPop(.6); buzz(6);
});
worldSvg.addEventListener('pointermove', e => {
  const g = drags.get(e.pointerId); if (!g) return;
  const p = svgPt(e), vb = worldSvg.viewBox.baseVal, b = g.box, m = 14;
  let dx = g.ox + p.x - g.sx, dy = g.oy + p.y - g.sy;
  if (vb.width > b.width + m*2) dx = Math.min(Math.max(dx, vb.x + m - b.x), vb.x + vb.width - m - (b.x + b.width));
  // carry it anywhere, sky included — it only has to stay on the page
  if (vb.height > b.height + m*2) dy = Math.min(Math.max(dy, vb.y + m - b.y), vb.y + vb.height - m - (b.y + b.height));
  const by = +g.el.dataset.by;
  g.el.dataset.dx = dx; g.el.dataset.dy = dy;
  g.el.setAttribute('transform', `translate(${dx} ${dy})`);
  setDepth(g.el, Math.max(by + dy, FAR));   // grows as it comes forward
});
const endDrag = e => {
  const g = drags.get(e.pointerId); if (!g) return;
  drags.delete(e.pointerId);
  delete g.el.dataset.held;
  const pop = g.el.querySelector('.pop');
  stopAnims(pop);
  // let go and it settles to its true size for where it now stands
  pop.animate([{transform:'scale(1.5)'},{transform:'scale(.92,1.12)'},{transform:'scale(1.05,.95)'},{transform:'scale(1)'}],
    {duration:440, easing:'ease-out'});
  g.el.classList.remove('dragging');
  const el = g.el, y = groundY(el);
  // a quick touch that went nowhere is a tap, not a drag
  const stirred = Math.hypot(+el.dataset.dx - g.ox, +el.dataset.dy - g.oy);
  if (stirred < 7 && Date.now() - g.t0 < 550 && tapProp(el)) return;
  // laid against either of them? then it is held rather than dropped
  const onWho = offeredTo(e, el);
  if (onWho){
    if (giveTo(onWho, el)) return;            // taken
  } else {
    // an open hand still catches something let go just beside it
    const b = el.getBBox(), mid = { x: b.x + b.width/2 + (+el.dataset.dx), y: b.y + b.height/2 + (+el.dataset.dy) };
    for (const who of ['lily','dino']){
      const h = handWorld(who);
      if (h && Math.hypot(mid.x - h.x, mid.y - h.y) < h.r && giveTo(who, el)) return;
    }
  }
  const settle = () => {
    const at = groundY(el);
    setDepth(el, at);
    // behind Lily if it now stands further off than she does, in front if nearer
    const layer = $(at < GROUND ? '#back' : '#front').lastElementChild;   // the live group, not one sliding out
    if (layer && el.parentNode !== layer) layer.appendChild(el);
    makeRoom(el);
    restack(el);
  };
  if (y < LAND){
    // let go in the air: it falls to the ground below, with a thump and a puff
    const land = { x: groundX(el), y: LAND };
    el.dataset.by = +el.dataset.by;
    fallTo(el, land.y - +el.dataset.by, () => {
      settle();
      sndThud(); buzz(10);
      const p = { x: groundX(el), y: groundY(el) };
      sparkles(p.x, p.y - 6, 5);
      el.querySelector('.pop').animate(
        [{transform:'scale(1)'},{transform:'scale(1.25,.7)'},{transform:'scale(.92,1.12)'},{transform:'scale(1)'}],
        {duration:420, easing:'ease-out'});
    }, land.x - +el.dataset.bx);
    return;
  }
  settle();
};
worldSvg.addEventListener('pointerup', endDrag);
worldSvg.addEventListener('pointercancel', endDrag);

// swipe to turn pages — single finger only, never while a prop is held,
// and the distance scales with the screen so it works on a small phone
let sw = null, fingers = 0;
$('#stage').addEventListener('pointerdown', e => {
  fingers++;
  if (fingers > 1 || drags.size){ sw = null; return; }
  // a tap needs almost no movement and a swipe needs a lot, so they can share
  // the scenery — only things you actually drag are off limits
  if (e.target.closest('button,select,.drag,#voices,#drawer,#magic')) return;
  sw = { id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now() };
});
const endSwipe = e => {
  fingers = Math.max(0, fingers - 1);
  if (!sw || sw.id !== e.pointerId) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y, dt = performance.now() - sw.t;
  sw = null;
  const need = Math.max(45, Math.min(90, innerWidth * .14));
  if (dt < 1200 && Math.abs(dx) > need && Math.abs(dx) > Math.abs(dy) * 1.2) go(cur + (dx < 0 ? 1 : -1));
};
$('#stage').addEventListener('pointerup', endSwipe);
$('#stage').addEventListener('pointercancel', endSwipe);
// a long press on a drawing shouldn't open the browser's own menu mid-drag
$('#stage').addEventListener('contextmenu', e => e.preventDefault());

/* ---------- playtime ----------
   The words fold away so the picture has the whole screen to play in. It
   happens by itself once the story has been told, and the button brings them
   back. Turning to another page brings them back too — if you are moving on,
   you are reading again. */
const wordsHidden = () => document.documentElement.classList.contains('playtime')
                       || document.documentElement.classList.contains('ended');
/* The end of the story is a moment, not one more panel of words: the words
   fold away and two big choices stand in the middle of the picture. */
/* One card, two jobs. At the title it offers the way in and waits above the
   title itself, which stays on show; at the end it offers the way round again
   and the words fold away behind it. */
function showEnd(on, title){
  const card = $('#endcard');
  if (!card) return;
  const want = !!on;
  if (want === !card.hidden) return;                    // already so
  if (want){
    // "Story Time" reads right at both ends - only where it leads differs
    card.dataset.to = title ? '1' : '0';
    card.classList.toggle('high', !!title);
  }
  document.documentElement.classList.toggle('ended', want && !title);   // the title keeps its words
  /* Only the ending is worth coming back to: the title's card is a moment in
     the opening, and skipping straight to it would rob a reader of it. */
  S.end = want && !title; save();
  card.hidden = !want;
  fit();
  if (want) sndTwinkle();
}
function setPlay(on, quiet){
  const was = document.documentElement.classList.contains('playtime');
  document.documentElement.classList.toggle('playtime', !!on);
  S.play = !!on; save();
  // playtime is for playing: nothing of the telling runs underneath it
  if (on){ shutUp(); markLine(-1); markWord(null); hideBubble(true); }
  const b = $('#wordsBtn');
  if (b){
    b.setAttribute('aria-pressed', on ? 'false' : 'true');
    b.setAttribute('aria-label', on ? 'Show the words' : 'Hide the words and play');
  }
  fit();
  /* Coming back out of playtime on a page whose words end in a choice - the
     title, or the very end - brings that choice back with them. */
  if (!on && was && P[cur] && (P[cur].title || P[cur].last))
    later(() => { if (!freePlay()) showEnd(true, !!P[cur].title); }, 520);
  if (on && !was && !quiet){ sndTwinkle(); toast('Playtime! Tap the lines button for the words'); }
}

// toolbar
function showTurn(){
  const b = $('#turnBtn');
  if (!b) return;
  const on = document.documentElement.classList.contains('sideways');
  b.setAttribute('aria-pressed', on);
  b.setAttribute('aria-label', on ? 'Stand the book upright' : 'Turn the book sideways');
}
/* A quarter turn of the whole book, for a phone held upright: the picture gets
   the long side of the screen, which is a far better shape for a meadow. */
function setSide(on, quiet){
  const was = document.documentElement.classList.contains('sideways');
  document.documentElement.classList.toggle('sideways', !!on);
  S.side = !!on; save();
  showTurn();
  fit();
  if (on && !was && !quiet) toast('Now hold your phone sideways \u2014 tap again to turn it back');
}
function showSound(){
  const b = $('#soundBtn');
  b.setAttribute('aria-pressed', soundOn);
  b.querySelector('.waves').style.display = soundOn ? '' : 'none';
}
$('#wordsBtn').onclick = () => { showEnd(false); setPlay(!document.documentElement.classList.contains('playtime')); buzz(8); };
$('#endAgain').onclick = () => { buzz(8); setPlay(false, true); go(+$('#endcard').dataset.to || 0); };
/* Playing on the last page means sitting in the dark watching them sleep, so
   the offer takes you back to the tea party, where there is something to do. */
$('#endPlay').onclick = () => { buzz(8); go(P.length - 2); setPlay(true); };   // the tea party, from either end
$('#turnBtn').onclick = () => { setSide(!document.documentElement.classList.contains('sideways')); buzz(8); };
$('#soundBtn').onclick = () => { soundOn = !soundOn; S.sound = soundOn; save(); showSound(); ambience(ambKind()); holidayAudio(false); };
showSound();
/* The book button STAYS even where reading aloud is impossible - a control
   that silently vanishes just looks broken. Tapping it says why instead. */
/* tap to read aloud, hold to choose who does the reading */
let hold = null, heldOpen = false;
const armHold = () => {
  heldOpen = false;
  hold = setTimeout(() => { heldOpen = true; buzz(12); openVoices(); }, 550);
};
$('#readBtn').addEventListener('pointerdown', armHold);
['pointerup','pointerleave','pointercancel'].forEach(t =>
  $('#readBtn').addEventListener(t, () => clearTimeout(hold)));
if (!window.PointerEvent){          // iPads old enough to predate pointer events
  $('#readBtn').addEventListener('touchstart', armHold, {passive:true});
  ['touchend','touchcancel'].forEach(t =>
    $('#readBtn').addEventListener(t, () => clearTimeout(hold), {passive:true}));
}
$('#readBtn').onclick = e => {
  if (!hasTTS){ toast('This browser cannot read aloud \u2014 try Chrome, Safari or Edge'); buzz(8); return; }
  primeTTS();        // a tap straight on this button is the gesture iOS wants
  if (heldOpen){ heldOpen = false; return; }
  readOn = !readOn;
  S.read = readOn; save();
  e.currentTarget.setAttribute('aria-pressed', readOn);
  // asking to be read to is asking to come back out of playtime
  if (readOn){
    if (freePlay()) setPlay(false, true);
    pickVoices();
    /* An engine with an empty voice list mimes the whole page in silence -
       far more confusing than being told. */
    let quorum = 0;
    try { quorum = speechSynthesis.getVoices().length; } catch(err){}
    if (!quorum){ toast('No reading voices on this device yet \u2014 look in Settings \u203a Text\u2011to\u2011speech'); huntVoices(); }
    speak(); hintVoices();
  }
  else { shutUp(); markLine(-1); }
};
$('#readBtn').setAttribute('aria-pressed', readOn);
function hintVoices(){
  if (S.hint) return;
  S.hint = true; save();
  toast('Hold this button to choose the voices');
}
let toastT = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 3400);
}
if (!document.fullscreenEnabled) $('#fsBtn').style.display = 'none';
$('#fsBtn').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch(e){} };

// progress stars
P.forEach((_,i) => {
  const b = document.createElement('button');
  b.setAttribute('aria-label', i === 0 ? 'Cover' : `Page ${i}`);
  b.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>`;
  b.onclick = () => go(i);
  $('#progress').appendChild(b);
});

// sky details
(() => {
  // fewer moving lights on a phone — they are the heaviest thing to animate
  const nStars = small() ? 34 : 55, nFlies = small() ? 11 : 18;
  let s = '';
  for (let i=0;i<nStars;i++) s += `<circle cx="${rand(-400,1400).toFixed(0)}" cy="${rand(-500,300).toFixed(0)}" r="${rand(1,2.6).toFixed(1)}" style="animation-delay:-${rand(0,3).toFixed(2)}s;animation-duration:${rand(2,4).toFixed(2)}s"/>`;
  $('#stars').innerHTML = s;
  const f = $('#flies');
  for (let i=0;i<nFlies;i++){
    const c = document.createElementNS(NS,'circle');
    c.setAttribute('cx', rand(30,970).toFixed(0)); c.setAttribute('cy', rand(140,560).toFixed(0)); c.setAttribute('r', rand(2.6,4.8).toFixed(1));
    c.style.setProperty('--dx', rand(-70,70).toFixed(0)+'px'); c.style.setProperty('--dy', rand(-50,50).toFixed(0)+'px');
    c.style.animationDuration = `${rand(6,11).toFixed(1)}s, ${rand(1.6,3).toFixed(1)}s`;
    c.style.animationDelay = `-${rand(0,8).toFixed(1)}s, -${rand(0,3).toFixed(1)}s`;
    f.appendChild(c);
  }
})();

// fit the picture to whatever shape of screen it lands on, and keep the
// stage honest about height while a phone's address bar slides around
const vv = window.visualViewport;
const fixvh = !(window.CSS && CSS.supports && CSS.supports('height','100dvh'));
if (fixvh) document.documentElement.classList.add('fixvh');
const SKY = 180, MIN_SLICE = 700, MIDDLE = 512;  // treetop line, least picture width, and where the action sits
function setBox(vb){
  [worldSvg, glowSvg].forEach(s => { s.setAttribute('viewBox', vb); s.setAttribute('preserveAspectRatio','xMidYMid meet'); });
}
function fit(){
  const de = document.documentElement;
  const vw = innerWidth, vh = (vv ? vv.height : innerHeight);
  if (!(vw > 0 && vh > 0)) return;   // a hidden or not-yet-laid-out tab measures zero: keep the last good view
  if (fixvh) de.style.setProperty('--vh', vh + 'px');
  /* Turned sideways, the book's width is the phone's height and the other way
     about - and if the phone itself is turned, the trick is no longer wanted. */
  let sideways = de.classList.contains('sideways');
  if (sideways && vw > vh){ de.classList.remove('sideways'); S.side = false; save(); showTurn(); sideways = false; }
  if (sideways){ de.style.setProperty('--sw', vh + 'px'); de.style.setProperty('--sh', vw + 'px'); }
  const w = sideways ? vh : vw, h = sideways ? vw : vh, r = w / h;
  if (r >= 1.2 && h >= 520){ setBox('0 0 1000 700'); return; }   // desktops keep the wide view
  /* On a phone the text panel owns the bottom of the screen, so work out
     what is left and hang the picture off the top of it: the characters
     then stand just above the words instead of hiding behind them. */
  const tall = r < 1.2;
  // must track the panel's max-height in CSS, or the picture leaves a gap
  const words = !wordsHidden();
  // must track the CSS: 30dvh panels under 641px wide, 28dvh above (tablets)
  const band = (words ? Math.max(tall ? 56 : 50, (tall ? (w <= 640 ? .30 : .28) : .34) * h) : (tall ? 56 : 50)) + 22;
  const anchor = tall ? 625 : 500;      // picture line that should land just above the panel
  const anchorPx = h - band;
  const scale = Math.min((anchorPx - (tall ? 64 : 52)) / (anchor - SKY), w / MIN_SLICE);
  if (!(scale > 0)){ setBox('0 0 1000 700'); return; }   // a pathological frame gets the plain view
  const vbW = w / scale, vbH = h / scale;
  setBox([MIDDLE - vbW/2, anchor - anchorPx/scale, vbW, vbH].map(Math.round).join(' '));
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (vv) vv.addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => { if (!document.hidden) fit(); });   // catch up once the tab is shown
fit();

/* Each closing step fends for itself: if one goes wrong on some odd old
   browser, the others still run and the book still opens. */
try { buildDrawer(); } catch(e){}
const finished = !!S.end;    // the story was left standing on its closing choice
try { setSide(!!S.side, true); } catch(e){}
try { setPlay(!!S.play, true); } catch(e){}
go(clamp(Math.round(S.page) || 0, 0, P.length - 1));   // open where the reader left off
if (finished && !freePlay() && P[cur] && P[cur].last) showEnd(true);
/* A child who chose playtime keeps it - but never silently: the words are
   hidden, so say where they went. */
if (S.play) later(() => toast('Playtime! Tap the lines button for the words'), 900);
})();
</script>
