<!doctype html>
<html lang="en" data-time="dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5F4FC9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lily and Dino">
<meta name="format-detection" content="telephone=no">
<title>Lily and Dino’s Magical Tea Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --panel:#FFFDF6ee; --ink:#3B2A55; --soft:#7A6A92; --stitch:#E8B9D2;
  --lily:#D23F7C; --dino:#2B8A55; --accent:#7B55D6;
  --btn:#FFFFFF; --btn-ink:#7B55D6; --gold:#FFC93C;
  font-family:"Grandstander","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#231C45ee; --ink:#F5EEFF; --soft:#BBAEDD; --stitch:#5E4C99;
    --lily:#FF93C2; --dino:#8FE6B2; --accent:#C6ABFF; --btn:#2E2659; --btn-ink:#E5D8FF;
  }
}
:root[data-theme="dark"]{
  --panel:#231C45ee; --ink:#F5EEFF; --soft:#BBAEDD; --stitch:#5E4C99;
  --lily:#FF93C2; --dino:#8FE6B2; --accent:#C6ABFF; --btn:#2E2659; --btn-ink:#E5D8FF;
}
*{box-sizing:border-box}
html{height:100%;background:#8FD3F4;transition:background 1.6s;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html[data-time="morning"]{background:#7FC2EA}
html[data-time="dusk"]{background:#5F4FC9}
html[data-time="night"]{background:#10163F}
/* fixed body + dvh: the picture and the buttons stay put when a phone's
   address bar slides in and out, and nothing rubber-bands */
body{margin:0;position:fixed;inset:0;overflow:hidden;color:var(--ink);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{position:relative;height:100%;height:100dvh;overflow:hidden;touch-action:none}
html.fixvh #stage{height:var(--vh,100%)}
.sky{position:absolute;inset:0;transition:opacity 1.6s ease}
#sky-day{background:linear-gradient(#8FD3F4,#D5F1F0 55%,#FFF1C2)}
#sky-morning{background:linear-gradient(#7FC2EA,#FFD9A6 56%,#FFC089);opacity:0}
#sky-dusk{background:linear-gradient(#5F4FC9,#B878C8 50%,#FFB08C);opacity:0}
#sky-night{background:linear-gradient(#10163F,#27286A 60%,#46398A);opacity:0}
[data-time="morning"] #sky-morning,[data-time="dusk"] #sky-dusk,[data-time="night"] #sky-night{opacity:1}
svg.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#glow{pointer-events:none}
#tint{position:absolute;inset:0;background:#2B2E7A;mix-blend-mode:multiply;opacity:0;transition:opacity 1.6s;pointer-events:none}
[data-time="dusk"] #tint{opacity:.16}
[data-time="night"] #tint{opacity:.45}

/* sky objects */
#sun,#moon{transition:transform 1.8s cubic-bezier(.3,.7,.3,1),opacity 1.6s}
#sun .core{transition:fill 1.6s}
[data-time="morning"] #sun{transform:translate(-560px,208px)}
[data-time="morning"] #sun .core{fill:#FFD16B}
[data-time="morning"] #tint{background:#FF9A5B;opacity:.07}
[data-time="morning"] #flies{opacity:.3}
[data-time="dusk"] #sun{transform:translate(-40px,230px)}
[data-time="dusk"] #sun .core{fill:#FFA06B}
[data-time="night"] #sun{transform:translate(-60px,340px);opacity:0}
#moon{opacity:0;transform:translate(0px,-80px)}
[data-time="night"] #moon{opacity:1;transform:none}
#stars{opacity:0;transition:opacity 1.6s}
[data-time="dusk"] #stars{opacity:.35}
[data-time="night"] #stars{opacity:1}
#stars circle{fill:#FFFBE0;transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25;transform:scale(.7)}to{opacity:1;transform:scale(1.15)}}
#flies{filter:url(#fglow);opacity:.6;transition:opacity 1.6s}
[data-time="dusk"] #flies{opacity:.9}
[data-time="night"] #flies{opacity:1}
#flies circle{fill:#FFF3A0;transform-box:fill-box;animation:drift 8s ease-in-out infinite alternate,blinkf 2.4s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0px,0px)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes blinkf{from{opacity:.2}to{opacity:1}}

/* weather */
#wx .cloud{fill:#FFFFFF;opacity:var(--o,.85);animation:cloudDrift var(--d,30s) ease-in-out infinite alternate;transform-box:fill-box}
@keyframes cloudDrift{from{transform:translateX(calc(var(--w,60px) * -1))}to{transform:translateX(var(--w,60px))}}
[data-weather="rain"] #wx .cloud{fill:#AEB9D0}
[data-weather="snow"] #wx .cloud{fill:#DCE4F2}
[data-time="dusk"] #wx .cloud{fill:#E7C3D8}
[data-time="night"] #wx .cloud{fill:#3B3F7A}
[data-time="morning"] #wx .cloud{fill:#FFE6CE}
[data-weather="rain"] #sun,[data-weather="snow"] #sun{opacity:.18}
[data-weather="cloudy"] #sun{opacity:.72}        /* a glimpse between the clouds */
[data-time="night"][data-weather="rain"] #moon,[data-time="night"][data-weather="snow"] #moon{opacity:.35}
#wx .rainbow{opacity:.5;mix-blend-mode:screen}
#precip{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#precip i{position:absolute;top:0;display:block;will-change:transform}
/* drops carry their own size, speed and opacity so the near ones read as
   close and fast and the far ones hang back — that depth is what makes rain
   look like rain instead of falling sticks */
#precip .rain{width:3px;height:26px;border-radius:3px;background:linear-gradient(rgba(205,235,255,0),rgba(226,245,255,.85) 45%,rgba(248,253,255,1));animation:fall var(--d) linear infinite}
#precip .snow{width:var(--s,8px);height:var(--s,8px);border-radius:50%;background:#fff;opacity:.92;box-shadow:0 0 7px rgba(255,255,255,.55);animation:flutter var(--d) linear infinite}
/* wind: leaves and petals streaming across, and everything rooted in the
   ground leaning with the gusts */
#precip .leaf{width:var(--s,10px);height:calc(var(--s,10px) * .62);border-radius:60% 12% 60% 12%;animation:blow var(--d,4s) linear infinite}
@keyframes blow{from{transform:translate3d(110vw,0,0) rotate(0deg)}to{transform:translate3d(-18vw,var(--rise,0px),0) rotate(560deg)}}
[data-weather="windy"] #wx .cloud{animation-duration:7s}
[data-weather="windy"] [data-act="tree"]{animation:sway 2.6s ease-in-out infinite alternate}
[data-weather="windy"] [data-act="tree"]:nth-child(2n){animation-duration:3.3s;animation-delay:-1.1s}
[data-weather="windy"] [data-act="tree"]:nth-child(3n){animation-duration:2.1s;animation-delay:-1.7s}
[data-weather="windy"] [data-act="bush"]{animation:sway 1.9s ease-in-out infinite alternate;animation-delay:-.5s}
[data-weather="windy"] [data-wind]{animation:sway 1.5s ease-in-out infinite alternate}
[data-weather="windy"] .drag:nth-child(2n) [data-wind]{animation-duration:1.9s;animation-delay:-.7s}
[data-weather="windy"] .drag:nth-child(3n) [data-wind]{animation-duration:1.25s;animation-delay:-.4s}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(2.4deg)}}
/* a veil of wet air over the whole scene */
[data-weather="rain"] #precip::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(132,168,210,.16),rgba(92,132,186,.32))}
/* cold: thin blue air, the colour drained out of the greens, frost creeping
   in from the edges of the picture, and two friends who can feel it */
[data-weather="snow"] #precip::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(204,229,255,.24),rgba(168,202,240,.3))}
[data-weather="snow"] #precip::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 46%,transparent 62%,rgba(226,240,255,.3) 90%,rgba(244,250,255,.6) 100%)}
[data-weather="snow"] #back,[data-weather="snow"] #front{filter:saturate(.68)}
[data-weather="snow"] #land{filter:saturate(.55) brightness(1.05)}
[data-weather="snow"] #flies{opacity:.14}
[data-weather="snow"] #lily .react,[data-weather="snow"] #dino .react{animation:shiver .32s ease-in-out infinite alternate}
@keyframes shiver{from{transform:translateX(-.9px)}to{transform:translateX(.9px)}}
@keyframes fall{from{transform:translate3d(0,-16vh,0)}to{transform:translate3d(-8vw,116vh,0)}}

/* holidays: things in the sky and on the ground, and what falls or floats */
#festive{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#festive i{position:absolute;top:0;left:0;display:block;will-change:transform}
#festive .conf{width:var(--s,10px);height:calc(var(--s,10px) * .55);border-radius:2px;animation:tumble var(--d,4s) linear infinite}
#festive .petal{width:var(--s,11px);height:calc(var(--s,11px) * .7);border-radius:60% 12% 60% 12%;animation:tumble var(--d,7s) linear infinite}
#festive .glit{width:var(--s,6px);height:var(--s,6px);border-radius:50%;animation:tumble var(--d,9s) linear infinite}
#festive .up{font-size:var(--s,16px);line-height:1;animation:rise var(--d,8s) linear infinite}
@keyframes tumble{from{transform:translate3d(var(--x,0),-16vh,0) rotate(0deg)}to{transform:translate3d(calc(var(--x,0) + var(--sway,26px)),116vh,0) rotate(var(--spin,720deg))}}
@keyframes rise{0%{transform:translate3d(var(--x,0),114vh,0) scale(.55) rotate(-10deg);opacity:0}
  14%{opacity:1}85%{opacity:1}100%{transform:translate3d(calc(var(--x,0) + var(--sway,40px)),-14vh,0) scale(1) rotate(10deg);opacity:0}}
#holiday .fly{animation:flyby var(--d,11s) linear infinite}
@keyframes flyby{from{transform:translateX(1150px)}to{transform:translateX(-1450px)}}
/* the witch takes a shorter run at it, so she is in view far more often */
#holiday .fly.slow{animation-name:flyby2}
@keyframes flyby2{from{transform:translateX(880px)}to{transform:translateX(-1080px)}}
#holiday .fw{transform-box:fill-box;transform-origin:center;animation:burst var(--d,2.8s) ease-out infinite}
@keyframes burst{0%{transform:scale(.08);opacity:0}12%{opacity:1}62%{transform:scale(1);opacity:.85}100%{transform:scale(1.35);opacity:0}}
#holiday .bob2{transform-box:fill-box;transform-origin:50% 100%;animation:bob2 var(--d,4s) ease-in-out infinite alternate}
@keyframes bob2{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-14px) rotate(2deg)}}
/* ghosts wander a loop of their own, fading as they turn */
.ghost{animation:haunt var(--d,14s) ease-in-out infinite}
@keyframes haunt{
  0%{transform:translate(0,0) scale(1);opacity:.92}
  20%{transform:translate(58px,-34px) scale(.92);opacity:.6}
  40%{transform:translate(112px,12px) scale(1.06);opacity:.95}
  60%{transform:translate(64px,46px) scale(.96);opacity:.55}
  80%{transform:translate(-22px,22px) scale(1.02);opacity:.9}
  100%{transform:translate(0,0) scale(1);opacity:.92}}
#holiday .sleighbob{transform-box:fill-box;transform-origin:50% 50%;animation:bob2 3.4s ease-in-out infinite alternate}
#holiday .flap{transform-box:fill-box;transform-origin:50% 30%;animation:flap2 .34s ease-in-out infinite alternate}
@keyframes flap2{from{transform:scaleY(.6)}to{transform:scaleY(1.15)}}
#holiday .twinkle,.l-wand .star,.glint{animation:twk var(--d,1.8s) ease-in-out infinite alternate}
.l-wand .star{--d:2.6s;transform-box:fill-box;transform-origin:center}
.l-wand{cursor:pointer}
@keyframes twk{from{opacity:.35}to{opacity:1}}
[data-holiday="halloween"] #festive::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(150,80,12,.16),rgba(60,22,84,.32))}
[data-holiday="valentine"] #festive::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,150,190,.1),rgba(255,110,165,.2))}
[data-holiday="xmas"] #festive::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(190,220,255,.1),rgba(140,180,235,.18))}
[data-holiday="newyear"] #festive::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(40,50,120,.18),rgba(20,25,70,.26))}

/* water on the ground: rings spreading where drops land, and puddles */
#land{transition:filter 1.4s}
[data-weather="rain"] #land{filter:brightness(.88) saturate(.92)}
#splash .sp{transform-box:fill-box;transform-origin:center;animation:splash var(--d,1.2s) linear infinite}
@keyframes splash{0%{transform:scale(.15);opacity:0}18%{opacity:.95}100%{transform:scale(2);opacity:0}}
#splash .puddle{fill:#BFE3FA;animation:shimmer var(--d,4s) ease-in-out infinite alternate}
@keyframes shimmer{from{opacity:.2}to{opacity:.46}}
@keyframes flutter{from{transform:translate3d(0,-12vh,0) rotate(0deg)}to{transform:translate3d(var(--sway,24px),112vh,0) rotate(220deg)}}

/* actors */
#lily,#dino{transform-box:view-box;transform-origin:0 0}
.tap{cursor:pointer}
/* anything you can poke: squashes from its base, or from its middle if it
   floats in the sky */
.poke{transform-box:fill-box;transform-origin:50% 100%}
.poke.mid{transform-origin:50% 50%}
/* the sky is only touchable when its light is actually up there */
#moon .tap{pointer-events:none}
[data-time="night"] #moon .tap{pointer-events:auto}
[data-time="night"] #sun .tap{pointer-events:none}
.react,.bob{transform-box:fill-box;transform-origin:50% 100%}
#lily .bob{animation:bob 2.6s ease-in-out infinite}
#dino .bob{animation:breathe 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
.l-wl,.l-wr{transform-box:fill-box;animation:flap .45s ease-in-out infinite alternate}
.l-wl{transform-origin:100% 75%}
.l-wr{transform-origin:0% 75%}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.72)}}
.flutter .l-wl,.flutter .l-wr{animation-duration:.11s}
.l-eye,.d-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.d-eye{animation-duration:5.8s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.d-tail{transform-box:fill-box;transform-origin:0% 70%;animation:wag 2.6s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
.d-head{transform-box:fill-box;transform-origin:85% 95%}
.d-blush{opacity:.3;transition:opacity .6s}
.blush .d-blush{opacity:1}
.d-star,.d-closed,.l-closed,.d-roar,.d-hanky{display:none}
/* out it comes for the sneeze, and his eyes screw shut with it */
.sneezing .d-hanky{display:inline;transform-box:fill-box;transform-origin:72% 18%;animation:hankyUp .3s cubic-bezier(.34,1.56,.64,1)}
.sneezing .d-eye{display:none}
.sneezing .d-closed{display:inline}
.sneezing .d-smile,.sneezing .d-roar{display:none}
@keyframes hankyUp{from{opacity:0;transform:scale(.25) rotate(-28deg) translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sneezing .d-hanky{animation:none}}
.sparkle .d-star{display:inline}
.roaring .d-roar{display:inline}
.roaring .d-smile{display:none}
.sleep .d-eye,.sleep .l-eye,.smelling .d-eye,.smelling .l-eye{display:none}
.sleep .d-closed,.sleep .l-closed,.smelling .d-closed,.smelling .l-closed{display:inline}
.sleep#lily .bob{animation-duration:5s}
.sleep .l-wl,.sleep .l-wr{animation-duration:2.4s}
.sleep .d-tail{animation-duration:6s}

/* scene props */
.drag{cursor:grab}
.drag.dragging{cursor:grabbing}
.pop{transform-box:fill-box;transform-origin:50% 100%}
[data-pop]{opacity:0}
.steam{animation:steam 2.2s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
.empty .tea,.empty .steam{display:none}
.tea{transform-box:fill-box;transform-origin:center}
.cupmove{transform-box:fill-box;transform-origin:50% 100%}
#gcup{transform-box:fill-box;transform-origin:50% 100%}
svg text{font-family:inherit}

/* UI */
#ui{position:absolute;inset:0;pointer-events:none}
#ui > *{pointer-events:auto}
#topbar{position:absolute;top:calc(12px + var(--safe-t));left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));display:flex;justify-content:space-between;align-items:center;gap:12px}
#progress{display:flex;gap:4px;flex-wrap:wrap;max-width:min(60vw,calc(100% - 168px))}
#progress button{position:relative;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
#progress svg{width:22px;height:22px;fill:#ffffff88;transition:transform .3s,fill .3s}
#progress .seen svg{fill:#fff}
#progress .on{background:rgba(255,255,255,.16)}     /* you are here */
#progress .on svg{fill:var(--gold);transform:scale(1.4)}
#progress button:active svg{transform:scale(1.15)}
.tools{display:flex;gap:8px}
/* Turning the book is only ever useful on a phone held upright - a tablet
   already has room, and a phone lying on its side has turned itself. */
#turnBtn{display:none}
@media (max-width:640px){#turnBtn{display:grid}}
@media (max-width:640px) and (orientation:landscape){#turnBtn{display:none}}
/* The whole book takes a quarter turn together, picture, words and all, so a
   phone held upright can still show the wide view. */
html.sideways #stage{position:fixed;top:50%;left:50%;width:var(--sw,100vh);height:var(--sh,100vw);transform:translate(-50%,-50%) rotate(90deg);transform-origin:50% 50%}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(40,20,80,.25);outline:2px dashed var(--stitch);outline-offset:-6px;touch-action:manipulation;transition:transform .12s ease}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-pressed="false"]{opacity:.6}
.icon-btn:focus-visible,.arrow:focus-visible,.cta:focus-visible,#progress button:focus-visible{box-shadow:0 0 0 4px var(--gold)}

#bottom{position:absolute;left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));bottom:calc(14px + var(--safe-b));display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end;max-width:1040px;margin:0 auto}
.arrow{width:68px;height:68px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 22px rgba(40,20,80,.3);outline:2.5px dashed var(--stitch);outline-offset:-8px;position:relative;touch-action:manipulation;transition:transform .12s ease}
.arrow:active:not(:disabled){transform:scale(.9)}
.arrow svg{width:34px;height:34px;transition:transform .2s}
.arrow:disabled{opacity:.3;cursor:default}
.arrow.ready::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--gold);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.3);opacity:0}}
.arrow.ready svg{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

#story{background:var(--panel);border-radius:26px;padding:13px 22px 11px;box-shadow:0 12px 34px rgba(40,20,80,.28);outline:2.5px dashed var(--stitch);outline-offset:-8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:clamp(15px,1.85vw,21px);line-height:1.42;font-weight:500;max-height:28vh;max-height:28dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;cursor:pointer;text-align:center;max-width:64ch;margin:0 auto;width:100%}
#story{transition:max-height .45s cubic-bezier(.3,.8,.3,1),opacity .3s,padding .45s,transform .45s}
html.playtime #story,html.ended #story{max-height:0!important;padding-top:0;padding-bottom:0;opacity:0;overflow:hidden;transform:translateY(24px);pointer-events:none}
html.playtime .hint,html.ended .hint{display:none}
/* the last page ends on a choice, standing in the middle of the picture */
#endcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center;padding:0 16px;pointer-events:none;transition:top .4s cubic-bezier(.3,.8,.3,1)}
#endcard.high{top:36%}                 /* the title stays on show beneath it */
#endcard[hidden]{display:none}
.cta.big{pointer-events:auto;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.07em;line-height:1.14;font-size:1.68em;padding:.78em 1.9em;min-height:88px;box-shadow:0 10px 28px rgba(30,15,60,.45);animation:endIn .55s cubic-bezier(.34,1.56,.64,1) backwards;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s ease,filter .22s ease}
.cta.big .l1,.cta.big .l2{white-space:nowrap}
.cta.big .l2{font-size:.52em;font-weight:600;opacity:.82;letter-spacing:.01em}
#endcard .cta.big:nth-child(2){animation-delay:.14s}
/* a lift, a glow and a shine sweeping across - worth reaching for */
.cta.big::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.5) 48%,transparent 64%);transform:translateX(-130%);pointer-events:none}
@media (hover:hover){

}
.cta.big:active{transform:translateY(-1px) scale(.96)}
@keyframes ctaWiggle{0%,100%{transform:rotate(0)}28%{transform:rotate(-3.5deg)}64%{transform:rotate(3.5deg)}}
@keyframes endIn{from{opacity:0;transform:translateY(22px) scale(.76)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cta.big{animation:none}.cta.big::after{display:none}.cta.big:hover .l1{animation:none}}
@media (max-width:640px){#endcard{gap:13px}.cta.big{font-size:1.18em;padding:.7em 1.25em;min-height:66px}}
#story p{margin:.15em 0;padding:.1em .4em;border-radius:12px;transition:background .25s}

#story p.speaking{background:rgba(255,201,60,.34)}
.w{display:inline-block;opacity:0;transform:translateY(10px);animation:wIn .45s cubic-bezier(.2,.9,.3,1.3) forwards;animation-delay:calc(var(--i) * 80ms);border-radius:9px;transition:background .1s linear,color .1s linear,box-shadow .1s linear}
/* the word being said right now, so a child can follow the voice along the line */
#story .w.saying,#story.done .w.saying{background:var(--gold);color:#3B2A55;box-shadow:0 0 0 2px var(--gold),0 3px 8px rgba(120,80,0,.28);transform:translateY(-2px);opacity:1}

@keyframes wIn{to{opacity:1;transform:translateY(0)}}
.boom{font-weight:900;color:#E0569A;font-size:1.45em;animation:wIn .45s cubic-bezier(.2,.9,.3,1.3) forwards,wob .9s ease-in-out infinite;animation-delay:calc(var(--i) * 80ms),calc(var(--i) * 80ms + .45s)}
@keyframes wob{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.07)}}
/* a speech bubble breathes while its line is being read */
.bubBob{transform-box:fill-box;transform-origin:50% 100%;animation:bubBob 2.8s ease-in-out infinite}
@keyframes bubBob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
@media (prefers-reduced-motion:reduce){.bubBob{animation:none}}

.hint{font-size:.68em;color:var(--soft);margin-top:.5em!important}
.title{margin:0;line-height:1.1;font-weight:900}
.title .small{display:block;font-size:.9em;color:var(--lily)}
.title .big{display:block;font-size:1.3em;color:var(--accent);letter-spacing:.01em}
.sub{color:var(--soft);font-size:.8em}
.cta{font:inherit;font-weight:700;font-size:.85em;border:0;border-radius:999px;padding:.6em 1.5em;margin-top:.5em;min-height:44px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(80,40,160,.35);touch-action:manipulation;transition:transform .12s ease}

/* the grown-ups' drawer, on the left */
#drawer{position:absolute;top:0;bottom:0;left:0;width:min(324px,88vw);padding:calc(14px + var(--safe-t)) 12px calc(14px + var(--safe-b)) calc(14px + var(--safe-l));background:var(--panel);box-shadow:8px 0 30px rgba(20,10,40,.28);transform:translateX(-101%);transition:transform .34s cubic-bezier(.3,.8,.3,1);z-index:4;overflow:visible}
.vempty{font-size:.78em;line-height:1.5;color:var(--soft);margin:.4em 0 .2em;text-align:left}
#drawer.open{transform:none}
#drawerIn{height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:6px 10px 0 2px}
#drawer h2{margin:.1em 0 .8em;font-size:1.15em;font-weight:900;color:var(--accent);text-align:center}
#drawer h3{margin:.2em 0 .5em;font-size:.86em;font-weight:900;color:var(--lily)}
#drawer section{margin-bottom:1.1em}
#drawer .cta{display:flex;align-items:center;justify-content:center;gap:.5em;width:100%;margin:.2em 0 0;min-height:56px;font-size:.9em}

.dnote{font-size:.68em;line-height:1.5;color:var(--soft);margin:.9em 0 0}

/* big picture buttons: a four-year-old picks with a thumb, not by reading */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{position:relative;display:grid;gap:3px;justify-items:center;align-content:center;padding:9px 3px 7px;min-height:86px;font:inherit;border-radius:20px;border:2.5px dashed var(--stitch);background:var(--btn);color:var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .14s ease,background .25s,border-color .25s}
.tile svg{width:44px;height:44px;display:block}

.tile.on::after{content:"✓";position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#5A3B00;font-size:15px;font-weight:900;display:grid;place-items:center;box-shadow:0 3px 8px rgba(30,15,60,.35)}

#drawerTab{position:absolute;left:100%;top:42%;width:50px;height:78px;padding:0;border:0;border-radius:0 22px 22px 0;background:var(--panel);color:var(--accent);display:grid;place-items:center;cursor:pointer;box-shadow:5px 4px 16px rgba(20,10,40,.3);touch-action:manipulation;transition:transform .14s ease}

#magic{position:absolute;inset:0;display:none;place-items:center;padding:14px;background:rgba(20,10,40,.5);z-index:6}

.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mtile{position:relative;display:grid;gap:2px;justify-items:center;align-content:center;padding:7px 2px 5px;min-height:82px;font:inherit;border-radius:18px;border:2.5px dashed var(--stitch);background:var(--btn);color:var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .12s ease,background .2s}

.mtile.surprise{border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--btn))}

/* who reads the story */
#voices{position:absolute;inset:0;display:none;place-items:center;padding:16px;background:rgba(20,10,40,.5);z-index:5}
#voices.open{display:grid}
#voicecard{background:var(--panel);border-radius:26px;padding:18px 18px 14px;width:100%;max-width:430px;max-height:84vh;max-height:84dvh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;box-shadow:0 18px 44px rgba(20,10,40,.45);outline:2.5px dashed var(--stitch);outline-offset:-8px;text-align:center}
#voicecard h2{margin:.1em 0 .6em;font-size:1.05em;color:var(--accent)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:.7em 0;text-align:left}
.vrow label{grid-column:1 / -1;font-size:.82em;font-weight:700;color:var(--soft)}
.vrow label.lily{color:var(--lily)}
.vrow label.dino{color:var(--dino)}
.vrow select{font:inherit;font-size:.82em;padding:.45em .6em;min-width:0;min-height:44px;border-radius:14px;border:2px solid var(--stitch);background:var(--btn);color:var(--ink);touch-action:manipulation}
.vplay{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:.9em;cursor:pointer;touch-action:manipulation;transition:transform .12s ease}
.vplay:active{transform:scale(.9)}
#voicenote{font-size:.72em;line-height:1.45;color:var(--soft);margin:.9em 0 0}
#toast{position:absolute;top:calc(66px + var(--safe-t));left:50%;transform:translateX(-50%);max-width:86vw;padding:.55em 1.1em;border-radius:999px;background:var(--panel);color:var(--ink);font-size:.78em;font-weight:700;text-align:center;box-shadow:0 8px 20px rgba(40,20,80,.3);opacity:0;transition:opacity .35s;pointer-events:none;z-index:6}
#toast.show{opacity:1}

@media (max-width:640px){
  .arrow{width:56px;height:56px}
  .arrow svg{width:26px;height:26px}
  #bottom{gap:8px;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r))}
  #topbar{top:calc(8px + var(--safe-t));left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r))}
  /* the blur is the most expensive thing on the page; the panel is opaque
     enough without it, and dropping it keeps older phones at 60fps */
  #story{padding:11px 14px 9px;border-radius:22px;max-height:30vh;max-height:30dvh;font-size:clamp(14px,3.6vw,18px);backdrop-filter:none;-webkit-backdrop-filter:none}
  #toast{top:calc(152px + var(--safe-t))}   /* clear of the stacked tools and stars */

  #topbar{flex-direction:column-reverse;align-items:stretch;gap:8px}
  .tools{align-self:flex-end}
  #progress{max-width:none;gap:0;justify-content:center}
  #progress button{width:42px;height:42px}
  #progress svg{width:23px;height:23px}
}

@media (max-height:520px) and (orientation:landscape){
  #bottom{bottom:calc(8px + var(--safe-b));gap:10px}
  #story{max-height:34vh;max-height:34dvh;padding:8px 14px 7px;border-radius:18px;font-size:clamp(13px,3.2vh,17px)}

  .arrow svg{width:24px;height:24px}
  .icon-btn{width:40px;height:40px}
  #topbar{top:calc(6px + var(--safe-t))}

  #progress{gap:0;max-width:calc(100% - 156px)}
  #progress button{width:32px;height:32px}
  #progress svg{width:18px;height:18px}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.2s!important}
}

<body>

        <stop offset="1" stop-color="#C9B2F3"/>

        <g fill="#74C28A">

        <g id="moon"><g class="tap poke mid" data-act="moon">

        </button>
        <button class="icon-btn" id="wordsBtn" aria-pressed="true" aria-label="Hide the words and play">

<script>
(() => {
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.22,.8,.3,1)';
const rand = (a,b) => a + Math.random()*(b-a);
/* Older tablet engines have Web Animations but not getAnimations(); asking an
   element that cannot answer used to crash the book while it was opening. */
const stopAnims = el => { if (el && el.getAnimations) el.getAnimations().forEach(a => a.cancel()); };
const clamp = (v,a,b) => Math.min(Math.max(v,a),b);

/* ---------- the bookmark ----------
   One key holds everything the reader chose: which page they were on, the

   the book anywhere and it opens there again. */
const SAVE_KEY = 'bs-lily-dino';
const S = { page:0, time:'auto', wx:'clear', holiday:'none', speed:1, sound:true, read:false, play:false, end:false, side:false, voices:{}, hint:false };
try { Object.assign(S, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}); } catch(e){}
if (!S.voices || typeof S.voices !== 'object') S.voices = {};

};
/* a fingertip is about 9mm across, so on touch screens the things you pick
   up are drawn bigger and spaced further apart */

  : '';

const deck = (cx, cy, r) => {
  const h = S.holiday, a = Math.round(cx - r*.5), b = Math.round(cx + r*.55), c = Math.round(cx + r*.05);
  const y1 = Math.round(cy + r*.3), y2 = Math.round(cy + r*.05), y3 = Math.round(cy + r*.55);
  if (h === 'xmas') return `<circle cx="${a}" cy="${y1}" r="8" fill="#E84A6B"/><circle cx="${a-2}" cy="${y1-2}" r="2.4" fill="#fff"/>
    <circle cx="${b}" cy="${y2}" r="7" fill="#FFD166"/><circle cx="${b-2}" cy="${y2-2}" r="2.2" fill="#fff"/>
    <circle cx="${c}" cy="${y3}" r="7.5" fill="#7FD4F0"/><circle cx="${c-2}" cy="${y3-2}" r="2.2" fill="#fff"/>`;
  if (h === 'halloween') return `<g class="twinkle" style="--d:${(1.4+Math.random()).toFixed(1)}s"><circle cx="${a}" cy="${y1}" r="6" fill="#FF9A3C"/><circle cx="${b}" cy="${y2}" r="5" fill="#C77DFF"/></g>`;
  if (h === 'easter') return `<ellipse cx="${a}" cy="${y1}" rx="7" ry="9" fill="#FFB5D0"/><ellipse cx="${b}" cy="${y2}" rx="6.5" ry="8.5" fill="#9BE0E8"/><ellipse cx="${c}" cy="${y3}" rx="6.5" ry="8.5" fill="#FFE27A"/>`;

  if (h === 'newyear' || h === 'birthday') return `<circle class="twinkle" style="--d:1.2s" cx="${a}" cy="${y1}" r="5" fill="#FFD166"/>
    <circle class="twinkle" style="--d:1.7s" cx="${b}" cy="${y2}" r="5" fill="#FF8FB8"/><circle class="twinkle" style="--d:2.1s" cx="${c}" cy="${y3}" r="5" fill="#7FD4F0"/>`;
  return '';
};
// the very top of a tree: a star at Christmas, a little ghost at Halloween
const topper = (x, y) => {
  const h = S.holiday;
  if (h === 'xmas') return `<g class="twinkle" style="--d:2.2s"><path d="M${x} ${y-22} l7 15 16 2 -12 11 4 16 -15 -8 -15 8 4 -16 -12 -11 16 -2z" fill="#FFD84D" stroke="#F0A800" stroke-width="2"/></g>`;
  if (h === 'halloween') return `<g class="ghost" style="--d:${(9+Math.random()*6).toFixed(1)}s"><g transform="translate(${x} ${y})">
    <path d="M-14 0 q0 -20 14 -20 q14 0 14 20 v18 q-7 -6 -9 0 q-3 6 -5 0 q-3 6 -6 0 q-3 6 -8 0z" fill="#FFFFFF" opacity=".92"/>
    <circle cx="-5" cy="-4" r="2.6" fill="#2B2440"/><circle cx="5" cy="-4" r="2.6" fill="#2B2440"/></g></g>`;
  return '';
};

/* ---------- character art ---------- */
/* Lily, drawn as a storybook fairy: a small round face with big bright eyes,
   long auburn hair in loose waves, blossoms tucked into it, a skirt of
   rainbow frills and butterfly wings panelled in pastel.
   Every landmark the rest of the book relies on is unchanged - her head sits
   at (0,-110), her mouth at (0,-94), her hands at (+/-30,-56) and her feet on
   the line y=0 - and the classes l-head, l-eye, l-closed, l-wl, l-wr, l-wand,
   cos and hand all keep their meaning. */
const polar = (a, r) => [+(Math.cos(a * Math.PI / 180) * r).toFixed(1),
                         +(Math.sin(a * Math.PI / 180) * r).toFixed(1)];

/* A butterfly's wing is one pane of glass held in a frame of veins, so hers
   is drawn that way: an outline filled with the whole rainbow at once, the
   veins fanning out from where it meets her back, and a row of cells along
   the outer margin. They sit out past her ear rather than straight above her
   shoulder, which would fan them over her hair like a crown. */
function wingPane(x, y, k, fill, shape, veins, margin, sheen){
  return `<g transform="translate(${x} ${y}) scale(${k})" opacity=".95">
    <path d="${shape}" fill="${fill}"/>
    <ellipse cx="${sheen[0]}" cy="${sheen[1]}" rx="${sheen[2]}" ry="${sheen[3]}" fill="url(#wing)" opacity=".36" transform="rotate(${sheen[4]} ${sheen[0]} ${sheen[1]})"/>
    <path d="${veins}" fill="none" stroke="#B9A0DF" stroke-width="1.5" opacity=".75" stroke-linecap="round"/>
    <path d="${margin}" fill="none" stroke="#B9A0DF" stroke-width="1.3" opacity=".6" stroke-linecap="round"/>
    <path d="${shape}" fill="none" stroke="#AC92D6" stroke-width="2.1" stroke-linejoin="round"/>
    ${sheen[5].map(([sx, sy, r]) => `<circle cx="${sx}" cy="${sy}" r="${r}" fill="#FFFFFF" opacity=".85"/>`).join('')}
  </g>`;
}
const FORE_SHAPE  = 'M1 3 C4 -20 9 -43 23 -56 C38 -69 54 -69 59 -54 C64 -39 56 -21 42 -10 C30 0 11 3 1 3 Z';
const FORE_VEINS  = 'M3 0 C9 -17 15 -33 25 -47 M3 0 C13 -13 24 -26 37 -38 M3 0 C15 -8 28 -17 44 -26 M3 0 C15 -3 30 -7 46 -12';
const FORE_MARGIN = 'M17 -49 C28 -40 38 -29 45 -17';
const HIND_SHAPE  = 'M0 -2 C17 -12 37 -10 44 1 C51 12 46 30 32 35 C20 40 8 33 3 21 C0 12 -1 3 0 -2 Z';
const HIND_VEINS  = 'M2 0 C14 -3 26 -3 36 1 M2 0 C13 5 23 11 31 19 M2 0 C8 8 13 17 17 28';
const HIND_MARGIN = 'M33 -3 C38 7 37 19 30 27';
const wingPair = () =>
    wingPane(6, -92, 1.3, 'url(#pane)',  FORE_SHAPE, FORE_VEINS, FORE_MARGIN,
             [26, -34, 21, 11, -42, [[45, -48, 2], [18, -12, 1.6], [52, -26, 1.7]]])
  + wingPane(14, -78, 1.2, 'url(#pane2)', HIND_SHAPE, HIND_VEINS, HIND_MARGIN,
             [20, 8, 15, 9, -28, [[36, 24, 1.8], [12, 6, 1.5]]]);

/* One frill of her skirt: a band that widens as it falls and finishes in a
   row of scallops. Five of them, stacked, make the rainbow. */
const scallops = (w, n, drop) => {
  const step = (w * 2) / n;
  let d = '';
  for (let i = 0; i < n; i++) d += ` q${(-step / 2).toFixed(1)} ${drop} ${(-step).toFixed(1)} 0`;
  return d;
};
const frill = (yt, yb, wt, wb, fill, line) => {
  const edge = scallops(wb, Math.max(4, Math.round(wb / 4.5)), 6);
  return `<path d="M${-wt} ${yt} L${wt} ${yt} L${wb} ${yb}${edge} Z" fill="${fill}"/>
  <path d="M${wb} ${yb}${edge}" fill="none" stroke="${line}" stroke-width="1.4" opacity=".5" stroke-linecap="round"/>`;
};

// a little blossom for her hair, and a leaf to tuck in beside it
const blossom = (x, y, s, c) => {
  let p = '';
  for (let i = 0; i < 5; i++){
    const a = i * 72 - 90, [px, py] = polar(a, 4.2 * s);
    const cx = (x + px).toFixed(1), cy = (y + py).toFixed(1);
    p += `<ellipse cx="${cx}" cy="${cy}" rx="${(3.3 * s).toFixed(1)}" ry="${(4 * s).toFixed(1)}" fill="${c}" transform="rotate(${a + 90} ${cx} ${cy})"/>`;
  }
  return `<g>${p}<circle cx="${x}" cy="${y}" r="${(1.9 * s).toFixed(1)}" fill="#FFD76B"/></g>`;
};
const leafSprig = (x, y, r, s) => `<path transform="translate(${x} ${y}) rotate(${r}) scale(${s})" d="M0 0 C6 -2.4 10 -6.4 12 -11.4 C5.6 -11 .8 -6 0 0 Z" fill="#82C48D"/>`;

/* One rippling lock of hair: a line that swings out and back as it falls.
   Drawn in twos and threes - dark for the hollow of each wave, light for its
   crest - it is what makes a head of hair read as wavy rather than as a
   smooth cap. A negative amplitude starts the swing the other way, which is
   how the two sides of her head are mirrored. */
function lock(x1, y1, x2, y2, swings, amp){
  const dx = (x2 - x1) / swings, dy = (y2 - y1) / swings;
  let d = `M${x1} ${y1}`;
  for (let i = 0; i < swings; i++){
    const bow = (i % 2 ? -amp : amp), ax = x1 + dx * i, ay = y1 + dy * i;
    d += ` C${(ax + bow).toFixed(1)} ${(ay + dy * .34).toFixed(1)}`
       + ` ${(ax + dx + bow).toFixed(1)} ${(ay + dy * .68).toFixed(1)}`
       + ` ${(ax + dx).toFixed(1)} ${(ay + dy).toFixed(1)}`;
  }
  return d;
}
/* The ends of her hair fall as separate locks rather than one heavy hem -
   each swings out, comes to a soft point and swings back. With the sides
   tapering in as they fall, the whole fall keeps its weight at her shoulder
   and thins away below, which is what stops it looking bulky. */
function hairTips(x1, x2, y, tips){
  const span = (x2 - x1) / tips.length;
  return tips.map((deep, i) => {
    const a = x1 + span * i, b = a + span, m = a + span * .5;
    return ` C${(a + span * .16).toFixed(1)} ${(y + deep * .55).toFixed(1)}`
         + ` ${(m - span * .1).toFixed(1)} ${(y + deep).toFixed(1)} ${m.toFixed(1)} ${(y + deep).toFixed(1)}`
         + ` C${(m + span * .1).toFixed(1)} ${(y + deep).toFixed(1)}`
         + ` ${(b - span * .16).toFixed(1)} ${(y + deep * .55).toFixed(1)} ${b.toFixed(1)} ${y}`;
  }).join('');
}
/* A little braid laid over her crown: small slanted plaits stepped along an
   arc from temple to temple, leaning one way then the other. The blossoms
   are pinned along the same arc, so they sit in it rather than on it. */
function braid(n){
  let out = '';
  for (let i = 0; i <= n; i++){
    const t = i / n, u = 1 - t;
    const x = u * u * -26 + t * t * 26;
    const y = u * u * -130 + 2 * u * t * -155 + t * t * -130;
    const a = Math.atan2(2 * u * -25 + 2 * t * 25, 2 * u * 26 + 2 * t * 26) * 180 / Math.PI;
    out += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="4.6" ry="2.5" fill="#A5663C" stroke="#6B3A22" stroke-width=".9" transform="rotate(${(a + (i % 2 ? 24 : -24)).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }

// a four-pointed glint, for the light that catches in a fairy's hair
const glint = (x, y, r, d) => `<path class="glint" style="--d:${d}s" transform="translate(${x} ${y})" d="M0 ${-r} Q${(r*.2).toFixed(1)} ${(-r*.2).toFixed(1)} ${r} 0 Q${(r*.2).toFixed(1)} ${(r*.2).toFixed(1)} 0 ${r} Q${(-r*.2).toFixed(1)} ${(r*.2).toFixed(1)} ${-r} 0 Q${(-r*.2).toFixed(1)} ${(-r*.2).toFixed(1)} 0 ${-r} Z" fill="#FFF0BC"/>`;

  + `</g>`;

const LILY = `
<circle cx="0" cy="-88" r="80" fill="transparent"/>

<g class="l-wl"><g transform="scale(-1 1)">${wingPair()}</g></g>

<path d="M0 -153 C-27 -153 -40 -134 -39.5 -114 C-39 -105 -43 -97 -41 -89 C-39 -81 -34 -75 -35 -67 C-36 -59 -32 -52 -28 -42${hairTips(-28, 28, -43, [24, 16, 17, 22])} C32 -52 36 -59 35 -67 C34 -75 39 -81 41 -89 C43 -97 39 -105 39.5 -114 C40 -134 27 -153 0 -153 Z" fill="url(#hair)" stroke="#6B3A22" stroke-width="1.4" stroke-linejoin="round"/>

${hairWaves('#D29659', 2.6, .5, 0)}
<path d="M-22 -134 C-13 -142 11 -142 20 -133 C11 -137.6 -13 -137.6 -22 -134 Z" fill="#E3A063" opacity=".45"/>
<g fill="none" stroke="#9A5B33" stroke-width="1.7" stroke-linecap="round" opacity=".85">
  <path d="M-27 -142 C-33 -147.5 -39.5 -146.5 -41.5 -141"/><path d="M27 -142 C33 -147.5 39.5 -146.5 41.5 -141"/>
  <path d="M-37 -124 C-44 -120 -45.5 -113 -42.5 -108"/><path d="M37 -124 C44 -120 45.5 -113 42.5 -108"/>
  <path d="M-33 -78 C-41 -73 -42.5 -64 -38 -59" stroke-width="1.5"/><path d="M33 -78 C41 -73 42.5 -64 38 -59" stroke-width="1.5"/>
</g>
${glint(-29, -117, 3.4, 2.1)}${glint(25, -97, 2.7, 2.8)}${glint(-17, -62, 2.4, 1.7)}${glint(31, -131, 2.3, 2.4)}

<g fill="none" stroke-linecap="round"><g stroke="#E6A98B" stroke-width="11"><path d="M-7 -40 C-8.5 -26 -8.5 -14 -8 -7"/><path d="M7 -40 C8.5 -26 8.5 -14 8 -7"/></g>
<g stroke="${LIMB}" stroke-width="8.4"><path d="M-7 -40 C-8.5 -26 -8.5 -14 -8 -7"/><path d="M7 -40 C8.5 -26 8.5 -14 8 -7"/></g></g>

  <circle cx="-12.9" cy="-110.4" r="2.5" fill="#FFFFFF"/><circle cx="8.1" cy="-110.4" r="2.5" fill="#FFFFFF"/>
  <circle cx="-8.1" cy="-104.2" r="1.3" fill="#FFFFFF" opacity=".85"/><circle cx="12.9" cy="-104.2" r="1.3" fill="#FFFFFF" opacity=".85"/>
  <path d="M-18 -110.8 Q-10.5 -119.6 -3.2 -112.4 M18 -110.8 Q10.5 -119.6 3.2 -112.4" stroke="#3B2418" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M-18.6 -111.4 q-4.2 -1.2 -6 -4.4 M18.6 -111.4 q4.2 -1.2 6 -4.4" stroke="#3B2418" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</g>

/* ---------- the ground plane ----------
   The picture is a flat drawing pretending to be a field, so one number ties
   it together: how far down the grass a thing stands. Lily's feet are at 478
   and she is drawn at full size, so that line is depth 1. Anything lower is
   nearer the reader and drawn larger; anything higher is further away and
   drawn smaller, stacked behind, and — past her feet — moved behind her. */
const GROUND = 478, NEAR = 650, FAR = 472, LAND = 492;   // LAND: where a thing dropped in the sky comes down
const depth = y => clamp(1 + (y - GROUND) * .004, .6, 1.8);
const groundY = el => +el.dataset.by + (+el.dataset.dy || 0);
const drag = (x,y,s,inner,pop=false,extra='') =>
  `<g class="drag" data-dx="0" data-dy="0" data-bx="${x}" data-by="${y}" data-base="${s}"><g transform="translate(${x} ${y}) scale(${(s*depth(y)).toFixed(3)})"><g class="pop" ${pop?'data-pop':''} ${extra}>${inner}</g></g></g>`;
// put a thing at its depth: the right size for where it stands
function setDepth(el, y){
  const inner = el.firstElementChild;
  inner.setAttribute('transform', `translate(${el.dataset.bx} ${el.dataset.by}) scale(${(+el.dataset.base * depth(y)).toFixed(3)})`);
}
// and in the right order: things further up the field are drawn first
function restack(el){
  const layer = el.parentNode;
  if (!layer) return;
  const y = groundY(el);
  const ahead = [...layer.children].find(n => n !== el && n.dataset.by !== undefined && groundY(n) > y);
  layer.insertBefore(el, ahead || null);
}
function sortLayer(g){
  [...g.children].filter(k => k.dataset.by !== undefined)
    .sort((a,b) => groundY(a) - groundY(b))
    .forEach(k => g.appendChild(k));
}
const groundX = el => +el.dataset.bx + (+el.dataset.dx || 0);
/* Where the cloth is, for laying things out on - a nice place to put the tea
   things, never a rule about where they have to stay. */
function theMat(){
  const all = [...document.querySelectorAll('.mat')];
  const m = all[all.length - 1];                       // the live one, not one sliding out
  if (!m) return null;
  return { x:+m.getAttribute('cx'), y:+m.getAttribute('cy'),
           rx:+m.getAttribute('rx') - 30, ry:+m.getAttribute('ry') - 8 };
}
/* Nothing lands on top of something else. Only things standing at about the
   same distance can collide — one further up the field simply passes behind —
   so crowded things step sideways until each has room of its own. */
function makeRoom(el){
  const sibs = [...(el.parentNode ? el.parentNode.children : [])]
    .filter(n => n !== el && n.classList && n.classList.contains('drag'))
    .map(o => ({ x:groundX(o), y:groundY(o), w:o.getBBox().width || 40 }));
  if (!sibs.length) return;
  const vb = worldSvg.viewBox.baseVal;
  const w = el.getBBox().width || 40;
  const x0 = groundX(el), y0 = groundY(el);
  const minX = vb.x + w*.5, maxX = vb.x + vb.width - w*.5;
  /* Look for the nearest patch with room: sideways first, keeping the depth
     the reader chose, then a step nearer or further if this row is full.
     (Nudging things apart a bit at a time deadlocks when one lands between
     two others — it just gets shoved back and forth and stays put.) */
  const free = (x,y) =>
    sibs.every(o => Math.abs(y - o.y) > 30 || Math.abs(x - o.x) >= (w + o.w) * .42);
  let spot = null;
  for (let ring = 0; ring <= 9 && !spot; ring++){
    for (const oy of (ring ? [0, ring*16, -ring*16] : [0])){
      const y = clamp(y0 + oy, FAR, NEAR);
      for (let ox = 0; ox <= 440 && !spot; ox += 12){
        for (const s of (ox ? [ox, -ox] : [0])){
          const x = clamp(x0 + s, minX, maxX);
          if (free(x, y)){ spot = { x, y }; break; }
        }
      }
      if (spot) break;
    }
  }
  const at = spot || { x: clamp(x0, minX, maxX), y: y0 };
  el.dataset.dx = at.x - +el.dataset.bx;
  el.dataset.dy = at.y - +el.dataset.by;
  el.setAttribute('transform', `translate(${el.dataset.dx} ${el.dataset.dy})`);
  setDepth(el, at.y);
}
/* ---------- holding things ----------
   Carry something to an open hand and it is taken: the item moves inside that
   character's drawing, so it rides along with every bob, hop and nod. Flowers
   gather into a bouquet; anything bigger needs the whole hand, so whatever was
   being held is set down on the grass first. */
const HANDS = { lily:{ x:-30, y:-56, s:.5 }, dino:{ x:-104, y:-108, s:.95 } };
const isFlower = el => el.querySelector('[data-wind]') || el.matches('[data-wind]') || !!el.dataset.wind;
/* A picked flower is held as a posy; a vase of them is bulky and held on its
   own - but both are worth putting your nose in. */
const smellable = k => k.dataset.posy === '1' || !!k.querySelector('[data-smell]');
function handWorld(who){
  const a = actors[who];
  if (!a || !a.shown || !a.st) return null;
  const h = HANDS[who], st = a.st;
  return { x: st.x + h.x * st.s * (st.flip ? -1 : 1), y: st.y + h.y * st.s, r: 78 * st.s };
}
/* Where has it come to rest? Anywhere on Lily or Dino counts as offering it
   to them, not just their hands - a small finger cannot be expected to find a
   fairy's fist. The test is the artwork itself, so the empty space beside a
   tail is still the grass, and the thing being carried is looked straight
   through. */
function offeredTo(e, dragged){
  if (!e || !isFinite(e.clientX) || !isFinite(e.clientY)) return null;
  let stack = [];
  try { stack = document.elementsFromPoint(e.clientX, e.clientY) || []; } catch(err){ return null; }
  for (let i = 0; i < stack.length; i++){
    const nd = stack[i];
    if (!nd || !nd.closest) continue;
    if (nd.closest('.drag') === dragged) continue;      // the thing being carried
    const a = nd.closest('#lily, #dino');
    if (a && actors[a.id] && actors[a.id].shown) return a.id;
  }
  return null;
}
const handPlace = (x,y,r,s) => `translate(${(+x).toFixed(1)}px, ${(+y).toFixed(1)}px) rotate(${(+r).toFixed(1)}deg) scale(${s})`;
function layoutHand(who){
  const host = $('#' + who + ' .hand');
  if (!host) return;
  const h = HANDS[who], kids = [...host.children];
  const posies = kids.filter(k => k.dataset.posy === '1');
  kids.forEach(el => {
    let x = h.x, y = h.y, r = 0;
    if (el.dataset.posy === '1'){                    // fan the stems out
      const off = posies.indexOf(el) - (posies.length - 1) / 2;
      x = h.x + off*6; r = off*18;
    }
    el.dataset.hx = x; el.dataset.hy = y; el.dataset.hr = r;
    el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)})`);

/* Anything this size is Dino's. Offered to Lily it is plainly far too big for
   a fairy to lift, and the pair of them see the funny side of her trying. */
const tooBig = el => (+el.dataset.base || 1) >= 1.6;
function tooBigLaugh(el){
  const L = actors.lily, D = actors.dino;
  lilyReact('giggle'); giggle(); buzz(10);
  if (L && L.shown) $('#lily').classList.add('blush');
  setTimeout(() => $('#lily').classList.remove('blush'), 1500);
  if (L && L.st){
    const s = L.st;
    popText(s.x, s.y - 200 * s.s, 'Too big!', { size:38, color:'#D23F7C', hold:760 });
    hearts(s.x, s.y - 130 * s.s, 3);
  }
  later(() => {
    if (!D || !D.shown || !D.st) return;
    dinoReact('chuckle');
    const s = D.st;
    popText(s.x - 112 * s.s * (s.flip ? -1 : 1), s.y - 350 * s.s,
            'Ha ha!', { size:46, color:'#2B8A55', hold:760 });
  }, 320);
  // the cup wobbles, as if she had tried and thought better of it
  const pop = el.querySelector('.pop');
  if (pop) pop.animate([
    { transform:'rotate(0deg)' }, { transform:'rotate(-8deg)', offset:.24 },
    { transform:'rotate(7deg)',  offset:.52 }, { transform:'rotate(-3deg)', offset:.78 },
    { transform:'rotate(0deg)' }
  ], { duration:760, easing:'ease-in-out' });
}
function giveTo(who, el){
  const host = $('#' + who + ' .hand');
  if (!host) return false;
  if (who === 'lily' && tooBig(el)){ tooBigLaugh(el); return false; }
  const posy = !!isFlower(el);
  const a = actors[who], st = a && a.st;
  // where it is at this moment, said in the character's own coordinates, so
  // the hand can reach out and take it from exactly there
  const from = st
    ? { x: (groundX(el) - st.x) / st.s * (st.flip ? -1 : 1), y: (groundY(el) - st.y) / st.s }

const TIMES = [['auto','Story'],['morning','Morning'],['day','Midday'],['dusk','Evening'],['night','Night']];
const WEATHERS = [['clear','Clear'],['cloudy','Cloudy'],['windy','Windy'],['rain','Rain'],['snow','Snow'],['rainbow','Rainbow']];
const SPEEDS = [['0.72','Slow'],['1','Normal'],['1.25','Quick']];
const WX_NEEDS = { rainbow:['morning','day','dusk'] };   // a rainbow needs light to be in
const timeNow = () => S.time === 'auto' ? (P[cur] || P[0]).time : S.time;

function applyScene(){
  const t = timeNow();
  // weather that makes no sense in this light quietly steps aside
  if (WX_NEEDS[S.wx] && WX_NEEDS[S.wx].indexOf(t) < 0){ S.wx = 'clear'; save(); }
  document.documentElement.dataset.time = t;
  document.documentElement.dataset.weather = S.wx;
  renderWeather();
  renderHoliday();
  updateDrawer();
}

/* The trees and bushes are built as markup, and they grow snow hats at build
   time — so changing the weather mid-page has to rebuild this page's scenery. */
function redrawScenery(){
  const pg = P[cur];
  if (!pg) return;
  let bi = cur; while (bi > 0 && !P[bi].back) bi--;
  swapLayer($('#back'), P[bi].back(), 1, 'instant');
  swapLayer($('#front'), pg.front ? pg.front() : '', 1, 'instant');
  // props that pop in on arrival are hidden until their entrance; they have
  // already made it, so let them be seen
  $('#front').querySelectorAll('[data-pop]').forEach(el => el.removeAttribute('data-pop'));
  placeHoliday();
}

/* The drift animation sets `transform`, and in SVG that is the same property
   as the transform attribute — so the placement has to live on an outer group,
   or every cloud collapses onto the origin. */
const cloud = (x,y,s,o) => `<g transform="translate(${x} ${y}) scale(${s})"><g class="cloud" style="--o:${o};--d:${(22+rand(0,18)).toFixed(1)}s;--w:${rand(18,54).toFixed(0)}px">
  <ellipse cx="0" cy="0" rx="92" ry="40"/><ellipse cx="-62" cy="14" rx="56" ry="30"/><ellipse cx="64" cy="16" rx="50" ry="27"/><ellipse cx="12" cy="-28" rx="54" ry="33"/></g></g>`;
const rainbowArt = () => '<g class="rainbow">' +
  ['#FF6B6B','#FFA94D','#FFD43B','#69DB7C','#4DABF7','#9775FA'].map((c,i) => {
    const r = 340 - i*23;
    return `<path d="M${500-r} 470 A ${r} ${r} 0 0 1 ${500+r} 470" fill="none" stroke="${c}" stroke-width="23"/>`;
  }).join('') + '</g>';

function renderWeather(){
  const wx = S.wx, sky = $('#wx'), p = $('#precip');
  ambience(ambKind());
  /* Always start from a clear sky. Clearing up front is what makes "Clear"
     mean clear — clouds, drops, flakes, puddles and the snow lying on the
     ground all go, whatever the weather was a moment ago. */
  sky.innerHTML = '';
  p.innerHTML = '';
  $('#splash').innerHTML = '';
  $('#snowground').innerHTML = '';
  if (wx === 'clear') return;

  /* Kept in the y 130–210 band: high in the sky on a tall phone, and still
     on screen where a short landscape window crops the top of the picture. */
  if (wx === 'rainbow') sky.innerHTML = rainbowArt() + cloud(170,178,.65,.5) + cloud(838,160,.6,.45);
  else if (wx === 'cloudy') sky.innerHTML = cloud(150,172,.95,.88) + cloud(520,138,.8,.8) + cloud(874,196,.9,.85);
  else if (wx === 'windy') sky.innerHTML = cloud(150,160,.8,.62) + cloud(560,140,.7,.55) + cloud(884,186,.75,.6);
  else sky.innerHTML = cloud(140,166,1.15,.95) + cloud(480,136,1,.92) + cloud(848,178,1.1,.95) + cloud(660,208,.7,.7);

  if (wx === 'windy'){
    // things the wind has picked up, streaming across the picture
    const cols = ['#8FD3A0','#6FC389','#B7E5AE','#FFD166','#FF9EC2'];
    const n = reduce ? 6 : (small() ? 15 : 26);
    let blown = '';
    for (let i = 0; i < n; i++){
      const z = rand(.4, 1);
      blown += `<i class="leaf" style="top:${rand(3,80).toFixed(0)}%;--s:${(7+z*9).toFixed(1)}px;--rise:${rand(-100,70).toFixed(0)}px;--d:${(5.6-z*2.7).toFixed(1)}s;animation-delay:-${rand(0,6).toFixed(1)}s;background:${cols[i%cols.length]};opacity:${(.5+z*.45).toFixed(2)}"></i>`;
    }
    p.innerHTML = blown;
    return;
  }
  if (wx !== 'rain' && wx !== 'snow') return;
  // rain and snow fall across the whole screen, so they get their own overlay
  const base = wx === 'rain' ? (small() ? 46 : 90) : (small() ? 30 : 55);
  const n = Math.round(reduce ? base / 3 : base);
  let html = '';
  for (let i = 0; i < n; i++){
    if (wx === 'rain'){
      const z = rand(.4, 1);                                  // how near this drop falls
      html += `<i class="rain" style="left:${rand(-8,108).toFixed(1)}%;width:${(1.8+z*2.8).toFixed(1)}px;height:${(18+z*28).toFixed(0)}px;--d:${(1.55-z*.7).toFixed(2)}s;animation-delay:-${rand(0,1.6).toFixed(2)}s;opacity:${(.45+z*.55).toFixed(2)}"></i>`;
    } else {
      const z = rand(.35, 1);                                 // near flakes fat and quick
      html += `<i class="snow" style="left:${rand(-6,106).toFixed(1)}%;--s:${(4+z*10).toFixed(1)}px;--sway:${rand(-120,120).toFixed(0)}px;--d:${(15-z*8).toFixed(1)}s;animation-delay:-${rand(0,14).toFixed(1)}s;opacity:${(.45+z*.5).toFixed(2)}"></i>`;
    }
  }
  p.innerHTML = html;
  if (wx === 'snow'){
    /* Snow settles: the same hills the land is drawn from, repainted white,
       with shallow blue hollows and a few drifts banked up in front. It is
       cleared at the top of this function, so it only ever lies while snowing. */
    $('#snowground').innerHTML = `
      <path d="M-800 470 Q-400 320 0 395 Q260 330 520 385 Q760 325 1000 390 Q1400 320 1800 470 Z" fill="#E6F1FF"/>
      <path d="M-800 470 Q-300 380 150 420 Q450 375 700 418 Q900 390 1100 420 Q1500 390 1800 470 Z" fill="#F3F8FF"/>
      <rect x="-1500" y="464" width="4000" height="2000" fill="#FBFDFF"/>
      <path d="M-1500 470 Q-1200 450 -900 470 T-300 470 T300 470 T900 470 T1500 470 T2100 470 T2700 470 V492 H-1500Z" fill="#FFFFFF"/>
      <g fill="#D9E8FA" opacity=".75"><ellipse cx="215" cy="524" rx="125" ry="17"/><ellipse cx="640" cy="551" rx="155" ry="19"/>
        <ellipse cx="905" cy="514" rx="92" ry="13"/><ellipse cx="55" cy="562" rx="115" ry="15"/></g>
      <g fill="#FFFFFF"><ellipse cx="158" cy="494" rx="72" ry="18"/><ellipse cx="424" cy="502" rx="94" ry="21"/>
        <ellipse cx="762" cy="495" rx="82" ry="18"/><ellipse cx="982" cy="506" rx="70" ry="16"/></g>`;
  }
  if (wx !== 'rain') return;
  /* Where the rain lands. These live in picture coordinates so they sit on the
     grass at any screen shape, and they loop in CSS rather than on a timer. */
  let ground = '';
  [[300,506,58],[520,528,88],[725,512,52],[178,540,42],[858,534,48]].forEach(([x,y,r],i) => {
    ground += `<ellipse class="puddle" cx="${x}" cy="${y}" rx="${r}" ry="${Math.round(r*.26)}" style="--d:${(3.2+i*.8).toFixed(1)}s;animation-delay:-${(i*.9).toFixed(1)}s"/>`;
  });
  const rings = reduce ? 0 : (small() ? 10 : 18);
  for (let i = 0; i < rings; i++){
    ground += `<g transform="translate(${Math.round(rand(110,910))} ${Math.round(rand(484,566))})">
      <g class="sp" style="--d:${rand(.9,1.5).toFixed(2)}s;animation-delay:-${rand(0,1.5).toFixed(2)}s">
      <ellipse rx="13" ry="4.4" fill="none" stroke="#DCF0FF" stroke-width="2.4"/>
      <ellipse rx="6" ry="2" fill="none" stroke="#F0FAFF" stroke-width="1.8"/></g></g>`;
  }
  $('#splash').innerHTML = ground;
}

const lightString = c => {
  let s = `<path d="M40 196 Q500 262 960 196" stroke="#5E6B8A" stroke-width="2.5" fill="none"/>`;
  for (let i = 0; i < 11; i++){

/* Three groups, by where a thing really is:
   `sky`    — far off behind the trees: Santa, the witch, fireworks, lights
   `air`    — flying over everything: bats and ghosts
   `ground` — standing on the grass, so it joins the scenery and takes its
              size and stacking from how far down the field it stands, exactly
              like the flowers. They sit in the 486–525 band: on the grass, and
              still above the text panel. */
function holidayArt(){
  const h = S.holiday;
  if (h === 'xmas') return {
    sky: santa(104,.55,22) + lightString(['#E84A6B','#FFD166','#7FD4F0','#8FD3A0']),
    // all within x 200–860, the slice a phone still shows
    ground: gift(206,518,1,'#E84A6B','#FFD166') + gift(310,498,.75,'#7FD4F0','#fff') +
      gift(790,522,.95,'#8FD3A0','#E84A6B') + gift(862,500,.7,'#9B8CFF','#FFD166')
  };
  if (h === 'halloween') return {
    sky: witch(128,1.45,17),
    // kept to the edges and high: ghosts drift rightward, so starting one
    // where the characters stand would park it on Dino's face
    air: bat(300,156,1.1,9) + bat(620,214,.8,13) + bat(880,120,1,16) + bat(470,268,.65,19) + bat(120,196,.9,24) +
      ghost(140,326,1.25,13) + ghost(880,286,1.1,17) + ghost(430,228,.85,21),
    ground: pumpkin(208,524,1) + pumpkin(322,500,.66) + pumpkin(820,520,.9)
  };
  if (h === 'newyear') return {
    sky: firework(250,180,'#FFD166',2.8,0) + firework(640,140,'#FF8FB8',3.2,1.1) +
      firework(860,230,'#7FD4F0',2.6,2) + lightString(['#FFD166','#FFF6E6','#FFD166','#fff']),
    ground: ''
  };
  if (h === 'easter') return {
    sky: '',
    ground: egg(206,518,1,'#FFB5D0','#C9558A') + egg(286,500,.8,'#9BE0E8','#3E8FA0') +
      egg(788,520,.95,'#FFE27A','#D9A227') + egg(856,502,.8,'#C6B5FF','#6B54C9') + egg(360,524,.7,'#A8E6B8','#3E8F5C')
  };
  if (h === 'birthday') return {
    sky: lightString(['#FF8FB8','#FFD166','#7FD4F0']),
    ground: balloon(214,506,1,'#FF6F9F',4) + balloon(302,488,.8,'#FFD166',5.2) +
      balloon(798,508,.95,'#7FD4F0',4.6) + balloon(862,486,.75,'#9B8CFF',5.8)
  };
  if (h === 'valentine') return {
    sky: `<g class="twinkle" style="--d:2.4s"><text x="500" y="210" font-size="56" text-anchor="middle" fill="#FF6F9F">♥</text></g>`,
    ground: balloon(214,508,1,'#FF6F9F',4.4) + balloon(820,506,.9,'#FF9EC2',5)
  };
  return { sky:'', ground:'' };
}
/* The things standing on the grass are handed to the scenery layers, where
   they are sorted and sized with the flowers and teacups rather than floating
   above them in a layer of their own. */
function placeHoliday(){
  const ground = holidayArt().ground || '';
  ['#back','#front'].forEach(id => {
    const host = $(id).lastElementChild;
    if (host) host.querySelectorAll('[data-hol]').forEach(n => n.remove());
  });
  if (!ground) return;

function placeActor(name, p, animate, dir){
  const a = actors[name], el = a.el, show = !!p;
  const tgt = p ? {x:p.x,y:p.y,s:p.s,flip:!!p.flip} : (a.st || {x:900,y:478,s:.85});
  stopAnims(el);
  const off = dir > 0 ? 1 : -1;
  const fromT = a.shown ? tf(a.st) : tf(Object.assign({}, tgt, { x: tgt.x + off*180 }));
  const base = a.st || tgt;
  const toT = show ? tf(tgt) : tf(Object.assign({}, base, { x: base.x - off*180 }));
  const fromO = a.shown ? 1 : 0, toO = show ? 1 : 0;
  if (animate && (a.shown || show)){
    const frames = [{transform:fromT,opacity:fromO},{transform:toT,opacity:toO}];
    if (name === 'lily' && a.shown && show){
      const m = {x:(a.st.x+tgt.x)/2, y:Math.min(a.st.y,tgt.y)-60, s:(a.st.s+tgt.s)/2, flip:tgt.flip};
      frames.splice(1,0,{transform:tf(m),opacity:1,offset:.5});
    }
    el.animate(frames,{duration:reduce?200:1050,easing:'cubic-bezier(.45,.05,.3,1)'});
  }
  el.style.transform = toT; el.style.opacity = toO;
  el.style.pointerEvents = show ? 'auto' : 'none';
  if (show) a.st = tgt;
  a.shown = show;
  el.classList.remove('blush','sparkle','sleep','roaring','flutter');
  if (p && p.pose) p.pose.split(' ').forEach(c => el.classList.add(c));
}

function swapLayer(layer, html, dir, mode){
  const old = [...layer.children];
  const g = document.createElementNS(NS,'g');
  g.innerHTML = html || '';
  sortLayer(g);                    // draw the field back to front
  layer.appendChild(g);
  if (mode === 'instant'){ old.forEach(o => o.remove()); return; }
  const D = reduce ? 200 : 750, off = (reduce || mode === 'fade') ? 0 : 200;
  old.forEach(o => {
    o.style.pointerEvents = 'none';
    const an = o.animate([{transform:'translate(0px,0px)',opacity:1},{transform:`translate(${-dir*off}px,0px)`,opacity:0}],{duration:D*.75,easing:'ease-in',fill:'forwards'});
    an.onfinish = () => o.remove();
    // a backgrounded tab pauses animations, and onfinish would never arrive —
    // without this the old scenery would pile up behind the new
    setTimeout(() => o.remove(), D + 400);
  });
  g.animate([{transform:`translate(${dir*off}px,0px)`,opacity:0},{transform:'translate(0px,0px)',opacity:1}],{duration:D,delay:D*.2,easing:EASE,fill:'backwards'});
}

function go(n){
  if (n < 0 || n >= P.length || n === cur) return;
  const first = cur === -1, dir = first ? 1 : (n > cur ? 1 : -1);
  clearTimers(); $('#fx').innerHTML = '';
  shutUp(); showEnd(false);
  if (!first){ pressArrow(dir > 0 ? $('#next') : $('#prev'), dir); whoosh(); }
  const pg = P[n]; cur = n;
  S.page = n; save();          // the bookmark moves with every page turn
  applyScene();
  // find the back layer for this scene (pages in the same scene share it)
  let bi = n; while (bi > 0 && !P[bi].back) bi--;
  const sameScene = pg.scene === lastScene;
  if (!sameScene) swapLayer($('#back'), P[bi].back(), dir, first ? 'instant' : 'slide');
  swapLayer($('#front'), pg.front ? pg.front() : '', dir, first ? 'instant' : (sameScene ? 'fade' : 'slide'));
  placeHoliday();                 // the new scenery needs its decorations back
  lastScene = pg.scene;
  placeActor('lily', pg.lily, !first, dir);
  placeActor('dino', pg.dino, !first, dir);
  renderText(pg);
  updateNav();
  if (pg.enter) later(() => { if (!freePlay()) pg.enter(); }, first ? 400 : 750);
  if (readOn) later(() => { if ($('#endcard').hidden) speak(); }, first ? 300 : 700);
  /* With no voice reading it there is nothing to wait for, so the choice
     comes up once the words have had time to be read; with a voice this is
     only a backstop, in case the last line never reports finishing. */
  /* Both ends of the book offer their choice, whether you read your way here
     or wandered here playing - one way back into the story, one further out
     into the picture. */
  if (pg.last || pg.title)
    later(() => showEnd(true, !!pg.title),
          freePlay() ? 260                       // playing: no telling to wait for
            : (readOn ? 14000 : (pg.title ? 2600 : 3400)));
}

function renderText(pg){
  const box = $('#story');
  box.classList.remove('done');
  $('#next').classList.remove('ready');
  let i = 0, html = '';
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  /* pi/wi tag each word with the chunk it belongs to and its place inside it,
     so the reading voice can light up one word at a time */
  const words = (t, pi, from) => t.split(' ').filter(Boolean)
    .map((w,k) => `<span class="w${/ROO+A+R|SLURP/.test(w)?' boom':''}" data-pi="${pi}" data-wi="${(from||0)+k}" style="--i:${i++}">${esc(w)}</span>`).join(' ');
  if (pg.title){
    html = `<h1 class="title"><span class="small">${words('Lily and Dino’s',0,0)}</span><span class="big">${words('Magical Tea Party',0,3)}</span></h1>`;
  } else {
    const parts = lineParts(pg);
    pg.lines.forEach((l,li) => {
      const who = typeof l === 'string' ? '' : l[0];
      const mine = parts.filter(p => p.line === li);
      html += `<p class="${who}" data-line="${li}">${mine.map(p => words(p.raw, p.pi, 0)).join(' ')}</p>`;
    });
  }
  if (pg.hint) html += `<p class="hint">✨ ${esc(pg.hint)}</p>`;
  box.innerHTML = html; box.scrollTop = 0;
  later(() => { box.classList.add('done'); if (!pg.last) $('#next').classList.add('ready'); }, reduce ? 50 : i*80 + 500);
}

function updateNav(){

/* ---------- effects ---------- */
function fxEl(html, x, y){
  const g = document.createElementNS(NS,'g');
  g.innerHTML = `<g class="fxi" style="transform-box:fill-box;transform-origin:center">${html}</g>`;
  // a bad number would spray SVG errors, so build it but leave it undrawn —
  // callers still get something they can animate
  if (!isFinite(x) || !isFinite(y)) return g;
  g.setAttribute('transform',`translate(${x} ${y})`);
  $('#fx').appendChild(g);
  /* Every effect clears itself when its animation ends — but a backgrounded
     tab freezes animations, so onfinish may never come and sparkles would pile
     up. Nothing here lives longer than 4s, so sweep up after 6. */
  setTimeout(() => g.remove(), 6000);
  return g;
}
function popText(x, y, txt, o={}){

  const hold = o.hold || 900;
  g.firstChild.animate([
    {transform:'scale(0) rotate(-10deg)',opacity:0},

    {transform:'scale(1.04) rotate(3deg)',opacity:1,offset:.6},

/* ---------- speech bubbles ---------- */
/* When Lily or Dino says a line it appears over their head, the way it would
   in a comic: the bubble grows out of the top of their head, breathes while
   the line is read, and shrinks back into them when it ends. The storyteller
   gets none - the words in the panel are hers. */
const HEADSEL = { lily:'.l-head', dino:'.d-head' };
const BUBS = {
  lily:{ fill:'#FFF3F8', ink:'#B02A63', edge:'#F3A3C6' },
  dino:{ fill:'#EEFBF2', ink:'#1C7A46', edge:'#93D9AE' }
};
/* Ask the picture where the head is rather than working it out from a
   remembered position and a fixed offset: the effects layer and the
   characters hang off different groups, and the arithmetic left Lily's
   bubble floating a long way above her. The screen matrices carry every
   transform between them, including her scale and which way she is facing. */
function headPos(who){
  const a = actors[who];
  if (!a || !a.shown || !a.el) return null;
  const head = a.el.querySelector(HEADSEL[who]) || a.el;
  let bb, m, f;
  try { bb = head.getBBox(); m = head.getScreenCTM(); f = $('#fx').getScreenCTM(); }
  catch(e){ return null; }
  if (!bb || !bb.width || !m || !f) return null;
  const pt = worldSvg.createSVGPoint();
  pt.x = bb.x + bb.width / 2;         // over the middle of the head
  pt.y = bb.y;                        // at the very top of it
  const q = pt.matrixTransform(f.inverse().multiply(m));
  if (!isFinite(q.x) || !isFinite(q.y)) return null;
  return { x:q.x, y:q.y - 10 };
}
/* SVG will not wrap a line for us, so break it into a few short ones */
function wrapSay(t, max){
  const out = [];
  let line = '';
  String(t).split(/\s+/).filter(Boolean).forEach(w => {
    if (!line) line = w;
    else if ((line + ' ' + w).length <= max) line += ' ' + w;
    else { out.push(line); line = w; }
  });
  if (line) out.push(line);
  if (out.length > 3){ out.length = 3; out[2] = out[2].replace(/[.,!?;:]+$/,'') + '\u2026'; }
  return out;
}
const xmlEsc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let bubbleEl = null, bubbleSweep = null;
function hideBubble(now){
  clearTimeout(bubbleSweep);
  const g = bubbleEl; bubbleEl = null;
  if (!g) return;
  if (now || reduce){ g.remove(); return; }
  const pop = g.querySelector('.bubPop');
  if (!pop){ g.remove(); return; }
  pop.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.24)',opacity:0}],
              {duration:260, easing:'cubic-bezier(.55,0,.85,.3)', fill:'forwards'});
  bubbleSweep = setTimeout(() => g.remove(), 340);
}
function showBubble(who, txt){
  const at = headPos(who), c = BUBS[who];
  hideBubble(true);
  if (!at || !c || !txt || !isFinite(at.x) || !isFinite(at.y)) return;

  const F = 30, lh = F * 1.26, padX = 26, padY = 14, tail = 26;
  const lines = wrapSay(txt, 20);
  const wide = Math.max.apply(null, lines.map(l => l.length));
  const boxW = Math.max(130, Math.round(wide * F * .55) + padX * 2);
  const boxH = Math.round(lines.length * lh) + padY * 2;
  const top = -(tail + boxH);

  /* keep the bubble inside the picture, and lean the tail back towards the
     speaker when it has had to shuffle sideways */
  const vb = (worldSvg.getAttribute('viewBox') || '0 0 1000 700').split(/\s+/).map(Number);
  const bx = clamp(at.x, vb[0] + boxW/2 + 12, vb[0] + vb[2] - boxW/2 - 12);
  const tdx = clamp(at.x - bx, -boxW/2 + 34, boxW/2 - 34);

  const text = lines.map((l,i) =>
    `<text x="0" y="${Math.round(top + boxH/2 + lh*(i - (lines.length-1)/2) + F*.34)}" text-anchor="middle" font-size="${F}" font-weight="700" fill="${c.ink}">${xmlEsc(l)}</text>`).join('');

  const g = document.createElementNS(NS,'g');
  g.setAttribute('transform', `translate(${Math.round(bx)} ${Math.round(at.y)})`);
  g.innerHTML =
    `<g class="bubBob"><g class="bubPop" style="transform-box:fill-box;transform-origin:50% 100%">
       <path d="M ${tdx-16} ${-tail+4} L ${at.x-bx} 6 L ${tdx+16} ${-tail+4} Z" fill="${c.fill}" stroke="${c.edge}" stroke-width="3.5" stroke-linejoin="round"/>
       <rect x="${-boxW/2}" y="${top}" width="${boxW}" height="${boxH}" rx="${Math.min(26, Math.round(boxH/2))}" fill="${c.fill}" stroke="${c.edge}" stroke-width="3.5"/>
       <rect x="${tdx-15}" y="${-tail-3}" width="31" height="8" fill="${c.fill}"/>
       ${text}
     </g></g>`;
  $('#fx').appendChild(g);

function fruitFall(el, fromDy, done){
  setDepth(el, +el.dataset.by);      // the size it lands at, held all the way

  const guard = setTimeout(stop, 2600);          // a paused tab must not strand it mid-air

    if (y >= 0){
